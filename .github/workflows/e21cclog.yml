name: E21CC Log tests

# Runs the E21CC Log's browser tests whenever the Log, or one of the old addresses that forward to it, changes.
on:
  pull_request:
    paths: ['e21cclog/**', 'logs/**', 'logsv2/**', 'logsv3/**', '.github/workflows/e21cclog.yml']
  push:
    branches: [main]
    paths: ['e21cclog/**', 'logs/**', 'logsv2/**', 'logsv3/**', '.github/workflows/e21cclog.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the test tools
        working-directory: e21cclog/tests
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the tests
        run: e21cclog/tests/run.sh
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e21cclog-test-reports
          path: e21cclog/tests/out
