<!DOCTYPE html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paths has moved</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2; url=../pathways/">
<script>
// Forward to ../pathways/, keeping any ?query and #hash.
// This address used to host a version with an offline cache; that
// registration is removed first so it cannot keep serving old files.
(function () {
  var target = '../pathways/' + location.search + location.hash;
  var go = function () { location.replace(target); };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      var done = navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return location.href.indexOf(r.scope) === 0; })
          .map(function (r) { return r.unregister(); }));
      });
      Promise.race([done, new Promise(function (ok) { setTimeout(ok, 800); })]).then(go, go);
      return;
    }
  } catch (e) { /* fall through */ }
  go();
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #0B1A3F; color: #EEF2FB; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  a { color: #FFC21A; font-weight: 700; }
</style>
</head>
<body>
<p>The latest Paths now lives at genapp/pathways. <a href="../pathways/">Open it here</a>.</p>
</body>
</html>
