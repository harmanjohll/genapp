<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" id="themeColor" content="#0b1446">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My CDL">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<title>Competency Development Log · Beatty Secondary School</title>
<link rel="icon" href="assets/crest.png">
<meta name="description" content="A Competency Development Log for Beattyians: GROW by reflecting, ACT on feedback, and watch your 21st Century Competencies grow, backed by your own words.">
<style>
@font-face{font-family:'Literata';src:url(assets/fonts/literata-var-latin.woff2) format('woff2');font-weight:200 900;font-style:normal;font-display:swap}
/* ------------------------------------------------------------------
   Tokens. BTY palette first (navy carries the weight, yellow marks,
   red only where the ACT slide already uses it), greys for everything
   else. The student's accent is the one colour they own.
   ------------------------------------------------------------------ */
:root{
  --navy:#000C53; --navy-2:#141f66; --navy-3:#2a3a8a;
  --yellow:#FFE200; --red:#EC3237;
  --g0:#ffffff; --g1:#F5F5F5; --g2:#E8E9F0; --g4:#C9CBD8; --g5:#9E9E9E; --g8:#424242; --ink:#212121;
  --accent:#FFE200; --accent-ink:#000C53;

  /* mood: mountain (default) */
  --bg:#0b1446; --bg-2:#1e2b62; --bg-3:#33427f;
  --on-bg:#ffffff; --on-bg-2:rgba(255,255,255,.74); --on-bg-3:rgba(255,255,255,.42);
  --card:#ffffff; --card-2:#f6f7fb; --card-3:#eceef7;
  --text:#1a1d33; --text-2:#5a5f7a; --line:#e3e5ef; --line-2:#cfd3e3;
  --head:#000C53;
  --shadow:0 12px 32px rgba(0,12,83,.22);
  --radius:20px; --radius-s:12px;
  --fs:16px; --lh:1.55;
  --nav-h:64px;
  --sans:Calibri,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --serif:Georgia,Literata,"Times New Roman","Noto Serif",serif;
}
body[data-mood="paper"]{
  --bg:#faf8f2; --bg-2:#f3f0e6; --bg-3:#ebe7da;
  --on-bg:#000C53; --on-bg-2:#3a4070; --on-bg-3:#8a8fae;
  --card:#ffffff; --card-2:#f7f6f1; --card-3:#efede4;
  --shadow:0 10px 28px rgba(0,12,83,.10);
}
body[data-mood="sunrise"]{
  --bg:#fff7c9; --bg-2:#ffefa3; --bg-3:#ffe680;
  --on-bg:#000C53; --on-bg-2:#3a4070; --on-bg-3:#8a8a6a;
  --card:#ffffff; --card-2:#fffbe8; --card-3:#fff4c2;
  --shadow:0 10px 28px rgba(120,90,0,.14);
}
body[data-mood="night"]{
  --bg:#07091a; --bg-2:#0f1330; --bg-3:#1a2048;
  --on-bg:#ffffff; --on-bg-2:rgba(255,255,255,.72); --on-bg-3:rgba(255,255,255,.4);
  --card:#151a3a; --card-2:#1c2248; --card-3:#242c5c;
  --text:#eef0ff; --text-2:#aab0d6; --line:#2a3160; --line-2:#3a4380;
  --head:#ffffff;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
body[data-accent="yellow"]{--accent:#FFE200;--accent-ink:#000C53}
body[data-accent="coral"]{--accent:#FF7A6B;--accent-ink:#3a0d08}
body[data-accent="mint"]{--accent:#5FD3A8;--accent-ink:#053a27}
body[data-accent="sky"]{--accent:#7CC0FF;--accent-ink:#082a4d}
body[data-accent="lilac"]{--accent:#C4ACFF;--accent-ink:#2b1560}
body[data-size="large"]{--fs:18px}
body[data-size="xl"]{--fs:20px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:var(--fs);line-height:var(--lh);color:var(--text);background:var(--bg);min-height:100vh;min-height:100dvh;overflow-wrap:break-word;color-scheme:light}
bodybody[data-mood="night"]{color-scheme:dark}
button,a,.chip,.comp{-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--serif);color:var(--head);margin:0 0 .35em;line-height:1.2;font-weight:700}
h1{font-size:1.9em} h2{font-size:1.35em} h3{font-size:1.1em}
p{margin:0 0 .8em}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
textarea{resize:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* backdrop: a quiet mountain line, the GROW slide's landscape */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 55%,var(--bg-3) 100%)}
.sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:42vh;min-height:220px;opacity:.55}
[data-mood="paper"] .sky svg,[data-mood="sunrise"] .sky svg{opacity:.35}
.sky .m1{fill:var(--bg-3)} .sky .m2{fill:var(--bg-2)} .sky .m3{fill:var(--bg)}
[data-mood="paper"] .sky .m1{fill:#e2ded0}[data-mood="paper"] .sky .m2{fill:#ece8db}[data-mood="paper"] .sky .m3{fill:#f3f0e6}
[data-mood="sunrise"] .sky .m1{fill:#f3d96a}[data-mood="sunrise"] .sky .m2{fill:#f9e58c}[data-mood="sunrise"] .sky .m3{fill:#ffefa3}
.sky .sun{fill:var(--accent);opacity:.9}
[data-mood="night"] .sky .sun{opacity:.5}

/* frame */
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 28px max(16px,env(safe-area-inset-right))}
body.composing #app{display:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px;color:var(--on-bg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand .word{font-family:var(--serif);font-weight:700;font-size:1.1em;letter-spacing:.01em}
.brand .sub{font-size:.72em;color:var(--on-bg-2);display:block;line-height:1.1}
.brand img{width:26px;height:auto;border-radius:4px}
.avatar{width:44px;height:44px;border-radius:50%;border:3px solid var(--accent);background:var(--card);color:var(--navy);display:grid;place-items:center;font-size:1.25em;padding:0;box-shadow:var(--shadow)}
.desknav{display:none;gap:4px}
.desknav a{color:var(--on-bg-2);text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600}
.desknav a.on{color:var(--on-bg);background:rgba(255,255,255,.12)}
[data-mood="paper"] .desknav a.on,[data-mood="sunrise"] .desknav a.on{background:rgba(0,12,83,.08)}
@media (min-width:760px){.desknav{display:flex}}

.nav{position:static;z-index:1;min-height:56px;display:flex;justify-content:space-around;align-items:stretch;background:var(--card);border-radius:var(--radius-s);box-shadow:var(--shadow);margin:8px 0 12px}
.nav a{min-height:56px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--text-2);font-size:.74em;font-weight:600;min-width:44px}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--navy)}
[data-mood="night"] .nav a.on{color:var(--yellow)}
.nav a.on svg{stroke:var(--accent)}
@media (min-width:760px){.nav{display:none}}

/* content */
main{padding-top:8px}
.hero{color:var(--on-bg);padding:18px 4px 22px}
.hero h1{color:var(--on-bg);font-size:2em;margin-bottom:.15em}
.hero .motto{font-family:var(--serif);font-style:italic;color:var(--on-bg-2);font-size:1.05em;border-left:3px solid var(--accent);padding-left:10px;margin:.4em 0 .2em}
.hero .meta{color:var(--on-bg-3);font-size:.9em}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:0 0 14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h2{margin-top:0}
.tiny{font-size:.8em;color:var(--text-2);overflow-wrap:anywhere}
.muted{color:var(--text-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack>*+*{margin-top:10px}

/* the two verbs */
.verbs{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media (min-width:560px){.verbs{grid-template-columns:1fr 1fr}}
.verb{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:var(--radius);padding:16px;background:var(--card);box-shadow:var(--shadow);color:var(--text);min-height:96px}
.verb:hover{transform:translateY(-1px)}
.verb .glyph{width:64px;height:64px;flex:0 0 64px}
.verb .glyph svg{width:64px;height:64px;margin:0;display:block}
.verb b{font-family:var(--serif);font-size:1.25em;color:var(--head);display:block}
.verb span{color:var(--text-2);font-size:.9em}
.verb .go{margin-left:auto;color:var(--navy);opacity:.6}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:2px solid var(--navy);background:var(--navy);color:#fff;padding:11px 20px;font-weight:700;min-height:44px;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--head);border-color:var(--line-2)}
[data-mood="night"] .btn.sec{color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--head);padding-left:10px;padding-right:10px}
[data-mood="night"] .btn.ghost{color:#fff}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.small{padding:6px 14px;min-height:40px;font-size:.9em}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--head);display:grid;place-items:center;padding:0}
[data-mood="night"] .iconbtn{color:#fff}
.iconbtn svg{width:22px;height:22px}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:700;margin-bottom:6px;color:var(--head)}
label.f small{display:block;font-weight:400;color:var(--text-2);margin-top:2px}
.in{width:100%;border:2px solid var(--line-2);border-radius:var(--radius-s);padding:11px 13px;background:var(--card);min-height:44px}
.in:focus{border-color:var(--navy);outline:0;box-shadow:0 0 0 3px rgba(255,226,0,.45)}
.in::placeholder{text-transform:none;color:var(--g5)}
[data-mood="night"] .in:focus{border-color:var(--yellow)}
textarea.in{min-height:96px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line-2);background:var(--card);border-radius:999px;padding:7px 13px;min-height:44px;color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
[data-mood="night"] .chip.on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.chip small{font-weight:400;opacity:.8}
.seg{display:inline-flex;border:2px solid var(--line-2);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:44px;color:var(--text);font-weight:600}
.seg button.on{background:var(--navy);color:#fff}
[data-mood="night"] .seg button.on{background:var(--yellow);color:var(--navy)}
.notice{border-left:4px solid var(--accent);background:var(--card-2);padding:10px 12px;border-radius:0 var(--radius-s) var(--radius-s) 0;margin:10px 0}
.notice.warn{border-color:var(--red)}
.notice.ok{border-color:#2f9e6f}

/* profile cards */
.profiles{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:520px){.profiles{grid-template-columns:1fr 1fr}}
.pcard{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--card);text-align:left;color:var(--text);min-height:64px}
.pcard .avatar{width:40px;height:40px;flex:0 0 40px;box-shadow:none;font-size:1.1em}
.pcard b{display:block;font-family:var(--serif);color:var(--head)}
.pcard small{color:var(--text-2)}

/* composer */
.sheet{position:relative;z-index:1;background:transparent}
.sheet .inner{max-width:720px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left)) 28px max(16px,env(safe-area-inset-right))}
.sheet .bar{display:flex;align-items:center;gap:10px;color:var(--on-bg);padding:6px 0 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet .bar b{font-family:var(--serif);font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .bar .iconbtn{color:var(--on-bg)}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
[data-mood="paper"] .steps i,[data-mood="sunrise"] .steps i{background:rgba(0,12,83,.15)}
.steps i.done{background:var(--accent)}
.steps i.now{background:var(--on-bg)}
.stephead{display:flex;align-items:center;gap:14px;color:var(--on-bg);margin-bottom:12px}
.stephead .kicker{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--on-bg-2)}
.stephead h2{color:var(--on-bg);margin:0;font-size:1.5em}
.stephead h2 em{font-style:italic;color:var(--accent)}
.medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.6em;flex:0 0 56px;box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.6)}
.medal.navy{background:var(--navy);color:var(--yellow)}
.medal.yellow{background:var(--yellow);color:var(--navy)}
.medal.red{background:var(--red);color:#fff}
.q{display:block;margin-bottom:16px}
.q>span{display:block;font-family:var(--serif);font-size:1.12em;color:var(--head);margin-bottom:8px}
.q .hint{display:block;font-size:.85em;color:var(--text-2);margin-top:6px}
.dock{padding:4px 0 0}
.dock .inner{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-left)) 8px max(16px,env(safe-area-inset-right))}
.dock .btn{min-height:44px;padding:8px 20px}
.dock .btn.ghost{color:var(--on-bg)}
.ring{width:150px;height:150px;margin:0 auto 10px;display:block}
@media (max-height:700px){.ring{width:104px;height:104px;margin-bottom:6px}.stephead{margin-bottom:8px}.stephead h2{font-size:1.25em}.stephead .kicker{font-size:.72em}.medal{width:44px;height:44px;flex-basis:44px;font-size:1.25em}.steps{margin:2px 0 10px}.sheet .bar{padding-bottom:6px}}

/* competency lens */
.domain{margin-bottom:14px}
.domain h3{margin-bottom:4px}
.domain .d{font-size:.85em;color:var(--text-2);margin-bottom:8px}
.comp{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:8px;color:var(--text)}
.comp .pick{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0;color:inherit;min-height:44px}
.comp.on{border-color:var(--navy);background:var(--card-3)}
[data-mood="night"] .comp.on{border-color:var(--yellow)}
.comp .pick b{display:block;color:var(--head)}
.comp .pick span{font-size:.9em;color:var(--text-2)}
.levels{display:flex;gap:6px;margin-top:8px}
.levels button{flex:1;border:2px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 4px;font-size:.85em;font-weight:600;min-height:44px;color:var(--text)}
.levels button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-mood="night"] .levels button.on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}

/* read back and coach */
.readback .qa{margin-bottom:12px}
.readback .qa b{display:block;font-family:var(--serif);color:var(--head);font-size:.98em}
.readback .qa p{margin:2px 0 0;white-space:pre-wrap}
.readback .qa p.empty{color:var(--g5);font-style:italic}
.coach{border:2px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--card-2)}
.coach .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.coach .who .avatar{width:36px;height:36px;font-size:1em;box-shadow:none;border-width:2px}
.coach .who b{font-family:var(--serif);color:var(--head)}
.coach .who small{color:var(--text-2);display:block}
.coach .part{margin-bottom:10px}
.coach .part b{display:block;font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin-bottom:2px}
.coach .part p{margin:0}
.coach .ask{border-left:3px solid var(--accent);padding-left:10px;font-family:var(--serif);font-size:1.05em}
.depth{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:.9em}
.depth i{width:12px;height:12px;border-radius:50%;background:var(--line-2);display:inline-block}
.depth i.on{background:var(--accent)}
.depth b{color:var(--head);white-space:nowrap}

/* competency read */
.stance{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.stance .track{display:flex;gap:4px;flex:0 0 auto}
.stance .track i{width:22px;height:10px;border-radius:5px;background:var(--line-2)}
.stance .track i.on{background:var(--accent)}
.stance b{color:var(--head)}
.evid{list-style:none;margin:0;padding:0}
.evid li{border-top:1px solid var(--line);padding:10px 0}
.evid li:first-child{border-top:0;padding-top:0}
.evid b{color:var(--head);font-family:var(--serif)}
.evid q{display:block;font-family:var(--serif);font-style:italic;margin:4px 0;color:var(--text);quotes:"“" "”"}
.evid small{display:block;color:var(--text-2)}
.evid .btn{margin-top:6px}
.str{font-size:.74em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--card-3);color:var(--head);white-space:nowrap}
.str.clear{background:var(--navy);color:#fff}
.str.strong{background:var(--accent);color:var(--accent-ink)}
.str.none{background:transparent;border:1px solid var(--line-2);color:var(--text-2)}
body[data-mood="night"] .str.clear{background:var(--yellow);color:var(--navy)}
.ask{border-left:3px solid var(--accent);padding-left:10px;font-family:var(--serif);font-size:1.05em;margin:4px 0 0}
.kick{display:block;font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin-bottom:2px}

/* lists */
.entry{display:flex;gap:12px;align-items:flex-start;border:0;border-bottom:1px solid var(--line);padding:12px 0;width:100%;text-align:left;background:transparent;color:var(--text)}
.entry:last-child{border-bottom:0}
.entry .medal{width:40px;height:40px;flex:0 0 40px;font-size:1.05em;box-shadow:none;border-width:2px}
.entry .grow{min-width:0}
.entry b{display:block;font-family:var(--serif);color:var(--head);overflow-wrap:anywhere}
.entry small{color:var(--text-2);display:block;overflow-wrap:anywhere}
.entry .snip{color:var(--text);font-size:.92em;margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
.dot.ok{background:#2f9e6f}
.tag{display:inline-block;background:var(--card-3);border-radius:999px;padding:2px 10px;font-size:.78em;font-weight:600;color:var(--head);margin:2px 4px 2px 0}

/* journey */
.bars .b{margin-bottom:10px}
.bars .b span{display:flex;justify-content:space-between;font-size:.9em}
.bars .b i{display:block;height:10px;border-radius:5px;background:var(--card-3);overflow:hidden}
.bars .b i b{display:block;height:100%;background:var(--navy);border-radius:5px}
[data-mood="night"] .bars .b i b{background:var(--yellow)}
.spark{width:100%;height:70px}
.next{display:flex;gap:12px;align-items:flex-start}
.next input{width:24px;height:24px;margin-top:2px;accent-color:var(--navy)}
.next p{margin:0;font-family:var(--serif);font-size:1.05em}

/* settings */
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0;background:var(--c)}
.sw.on{border-color:var(--head);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--head)}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:400px){.moods{grid-template-columns:repeat(2,1fr)}}
.mood{border:2px solid var(--line-2);border-radius:var(--radius-s);padding:8px 4px;background:transparent;color:var(--text);font-size:.85em;font-weight:600;min-height:64px}
.mood i{display:block;height:26px;border-radius:8px;margin-bottom:6px}
.mood.on{border-color:var(--head)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.3em;padding:0}
.emojis button.on{border-color:var(--navy);background:var(--card-3)}
details{border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 12px;margin-bottom:10px;background:var(--card)}
summary{cursor:pointer;font-weight:700;color:var(--head)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--card-3);padding:1px 5px;border-radius:4px}
pre{background:var(--card-3);padding:10px;border-radius:var(--radius-s);overflow:auto;font-size:.85em}

/* framed by a viewer (the claude.ai preview, an LMS): same layout, only dialogs differ */
.inline-dlg{border:2px solid var(--accent)}

/* toast + dialog */
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:18px;z-index:50;box-shadow:var(--shadow);max-width:90vw;font-weight:600;text-align:center}
@media (min-width:760px){.toast{top:auto;bottom:24px}}

dialog{border:0;border-radius:var(--radius);padding:0;max-width:min(92vw,520px);width:100%;background:var(--card);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,12,83,.5)}
dialog .body{padding:20px}
.footer{color:var(--on-bg-3);font-size:.78em;text-align:center;padding:26px 0 10px}
.footer b{font-family:var(--serif);color:var(--on-bg-2)}
.band{display:block;width:100%;height:auto;border-radius:10px;margin-top:8px;opacity:.95}
.welcome{max-width:560px;margin:0 auto}
.welcome .hero{text-align:left;padding-top:28px}
.welcome .hero h1{font-size:2.2em}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:18px;height:18px;border:3px solid rgba(0,0,0,.15);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Competency Development Log ---------- */
.brand .word{line-height:1.15;font-size:clamp(.9em, 3.7vw, 1.1em)}
.brand{min-width:0}
.flabel{display:block;font-weight:700;margin-bottom:6px;color:var(--head)}
.two{display:grid;gap:0 14px;grid-template-columns:1fr}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.hero .kicker{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--on-bg-2);margin:0 0 4px}
.hero .kicker a{color:inherit}
.seg.years{margin-top:8px;border-color:rgba(255,255,255,.3)}
.seg.years button{color:var(--on-bg)}
[data-mood="paper"] .seg.years,[data-mood="sunrise"] .seg.years{border-color:var(--line-2)}
.pick-row{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;cursor:pointer;background:var(--card)}
.pick-row input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--navy)}
.pick-row b{display:block;color:var(--head)}
.pick-row small{display:block;color:var(--text-2)}
.pick-row:has(input:checked){border-color:var(--navy);background:var(--card-3)}
[data-mood="night"] .pick-row:has(input:checked){border-color:var(--yellow)}
.bigline{font-family:var(--serif);font-size:1.1em;color:var(--head);margin:0 0 6px}

/* the map: four trails, one per basket */
.mapcard{padding:16px 16px 12px}
.maphead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.maphead h2{margin:0;font-size:1.15em}
.trails{display:flex;flex-direction:column;gap:6px}
.trail{display:block;text-decoration:none;color:var(--text);border-radius:var(--radius-s);padding:6px 4px 2px;margin:0 -4px}
.trail:hover{box-shadow:inset 0 0 0 2px var(--line)}
.tl{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:8px;padding:0 6px}
.tl b{font-family:var(--serif);color:var(--head);font-size:1em}
.tl small{grid-column:1/-1;color:var(--text-2);font-size:.8em}
.tl .go{color:var(--navy);opacity:.45}
.tl .go svg{width:16px;height:16px;vertical-align:-3px}
[data-mood="night"] .tl .go{color:var(--yellow)}
.trail-svg{display:block;width:100%;height:76px;overflow:visible}
.trail-svg .tb0{fill:var(--card-2)} .trail-svg .tb1{fill:var(--card-3)}
.trail-svg .base{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.trail-svg .now{stroke:var(--red);stroke-width:1.5;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;opacity:.7}
.trail-svg .line{fill:none;stroke:var(--navy);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
[data-mood="night"] .trail-svg .line{stroke:#aab6ff}
.trail-svg .dot{stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-width:9}
.trail-svg .dot.s1{stroke:var(--g4)} .trail-svg .dot.s2{stroke:var(--navy-3)} .trail-svg .dot.s3{stroke:var(--navy)}
[data-mood="night"] .trail-svg .dot.s2{stroke:#7f8ce0} [data-mood="night"] .trail-svg .dot.s3{stroke:#dfe4ff}
.trail-svg .dot.many{stroke-width:12}
.trail-svg .lit-ring{stroke:var(--navy);stroke-width:13;stroke-linecap:round;vector-effect:non-scaling-stroke}
.trail-svg .lit{stroke:var(--yellow);stroke-width:8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.terms{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:.72em;font-weight:700;color:var(--text-2);letter-spacing:.06em;padding:2px 6px 0}
.legend{margin:8px 0 0}
.litkey{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 2px var(--navy);vertical-align:-1px;margin:0 2px}
.lastline{color:var(--on-bg-2);font-size:.92em;margin:0 4px 14px}
.lastline a{color:var(--on-bg)}
.notecard{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--text);border-left:5px solid var(--red)}
.notecard svg{width:28px;height:28px;color:var(--red);flex:0 0 28px}
.notecard b{display:block;font-family:var(--serif);color:var(--head)}
.notecard small{color:var(--text-2)}
.newnote{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:0 8px;font-size:.9em;font-weight:700}

/* a basket: statements and their evidence */
.stmts{list-style:none;margin:0;padding:0}
.st{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0}
.st:first-child{border-top:0;padding-top:4px}
.st .mark{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:2.5px solid var(--g4);margin-top:3px;background:transparent}
.st.linked .mark{border-color:var(--navy);background:linear-gradient(90deg,var(--navy) 50%,transparent 50%)}
.st.lit .mark{border-color:var(--navy);background:var(--yellow);box-shadow:0 0 0 3px rgba(255,226,0,.35)}
[data-mood="night"] .st.linked .mark,[data-mood="night"] .st.lit .mark{border-color:var(--yellow)}
.st-text{font-family:var(--serif);color:var(--head);font-size:1.05em;margin:0 0 4px}
.st.hollow .st-text{color:var(--text-2)}
.st .ev{border-left:3px solid var(--line-2);padding:4px 0 4px 10px;margin:6px 0}
.st .ev.ok{border-left-color:var(--yellow)}
.st .ev a{font-size:.9em;color:var(--head)}
.st .ev q,.st .sugg q{display:block;font-family:var(--serif);font-style:italic;margin:2px 0;quotes:"“" "”"}
.st .sugg{background:var(--card-2);border-radius:var(--radius-s);padding:8px 10px;margin:6px 0}
.st .sugg a{font-size:.9em;color:var(--head)}
.st .btn{margin-top:4px}
.linkbtn{border:0;background:transparent;color:var(--text-2);font-size:.8em;text-decoration:underline;padding:4px 0;min-height:32px}
.stmts.mini .st{padding:6px 0;font-size:.92em}
.stmts.mini .st .mark{width:14px;height:14px;flex-basis:14px}
.st-quote{font-family:var(--serif);font-style:italic;border-left:3px solid var(--accent);padding-left:10px;color:var(--head)}

/* margin notes: beside the paragraph on wide screens, under it on phones */
.qa-row .notes{margin:0 0 12px}
.mnote{border-left:3px solid var(--red);background:var(--card-2);padding:8px 12px;margin:6px 0 10px 6px;border-radius:0 var(--radius-s) var(--radius-s) 0}
.mnote .by{display:block;font-size:.74em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin-bottom:2px}
.mnote p{margin:0;font-family:var(--serif);font-style:italic;color:#B3141A;white-space:pre-wrap}
body[data-mood="night"] .mnote p{color:#FF8A8D}
.mnote.unread{box-shadow:inset 0 0 0 2px rgba(236,50,55,.25)}
.notes details.older{border:0;padding:0;margin:0 0 4px 6px;background:transparent}
.notes details.older summary{font-size:.8em;color:var(--text-2);font-weight:600}
@media (min-width:1024px){
  body.wide .app{max-width:1080px}
  .qa-row{display:grid;grid-template-columns:minmax(0,1fr) 260px;column-gap:24px;align-items:start}
  .qa-row .notes{margin:0}
  .qa-row .mnote{margin:0 0 8px}
}

/* settings lists */
.groups{list-style:none;margin:0 0 12px;padding:0}
.groups li{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.groups li:first-child{border-top:0}
.groups b{font-family:var(--serif);color:var(--head)}
.groups small{display:block;color:var(--text-2)}
.adult .chips .chip svg{width:16px;height:16px}
</style>
</head>
