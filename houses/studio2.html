<style>

/* nav */

.gnav .in{max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:1px}

.gnav .sp{flex:1}

 background:transparent;color:#fff;cursor:pointer;margin:0 0 0 6px}

/* always-visible consequence bar */

.sbar .pill.warn{background:#fff8d8;color:var(--warn);border:1px solid #e8d98a}
.sbar .pill.bad{background:#fdeceb;color:var(--bad);border:1px solid #f0bfbc}

.sbar .kv.bad b{color:var(--bad)}.sbar .kv.ok b{color:var(--ok)}
.sbar .sp{flex:1}

/* chips */

 background:#fff;color:var(--g4);cursor:pointer;border-radius:13px;white-space:nowrap}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:bold}
.chip.alt.on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
label.l em.chg{color:var(--red)}

.gridmx td,.gridmx th{border:1px solid var(--g2);padding:6px 7px;text-align:center}

.shell{max-width:1340px;margin:0 auto;padding:0 18px 90px;display:flex;gap:24px;align-items:flex-start}
.rail{width:288px;flex:0 0 288px;position:sticky;top:44px;padding:18px 0 30px;max-height:calc(100vh - 44px);overflow-y:auto}
.main{flex:1;min-width:0;padding:22px 0 0;overflow-anchor:none}
/* Below 1080 the rail stops being a sidebar. 26 controls stacked above the
   content pushed it 3,000px down the page, so it becomes a closed drawer and
   the content comes first. */
.railtoggle{display:none}
@media(max-width:1080px){
  .shell{display:block;padding-bottom:70px}
  .rail{width:auto;flex:none;position:static;max-height:none;overflow:visible;padding:0;margin:12px 0 16px}
  .railtoggle{display:flex;width:100%;align-items:center;justify-content:space-between;
    font-family:Georgia,serif;font-size:14px;min-height:44px;padding:0 14px;
    background:var(--navy);color:#fff;border:0;cursor:pointer}
  .railtoggle i{font-style:normal;color:var(--yellow);font-size:18px}
  .rail:not(.open) .railbody{display:none}
  .railbody{border:1px solid var(--g2);border-top:0;padding:12px}
  .main{padding-top:14px}
  /* one swipeable line rather than four wrapped rows */
  .gnav .in,.sbar .in{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .gnav .in::-webkit-scrollbar,.sbar .in::-webkit-scrollbar{height:3px}
  .gnav .sp,.sbar .sp{display:none}
  .gnav b{position:sticky;left:0;background:var(--navy);z-index:1}

}

 color:var(--navy);background:var(--g1);padding:6px 10px;border-bottom:1px solid var(--g2);cursor:pointer;
 display:flex;justify-content:space-between;align-items:center}
.grp>h5 i{font-style:normal;color:var(--g3);font-size:13px}
.grp .bd{padding:10px}

.f{margin-bottom:11px}

 letter-spacing:.055em;color:var(--g4);margin:0 0 3px;font-weight:bold;gap:6px}
label.l em{font-style:normal;font-family:Georgia,serif;font-size:13px;color:var(--navy);text-transform:none;letter-spacing:0}
input[type=range]{width:100%;accent-color:var(--navy);margin:1px 0;display:block;min-height:24px}

select{width:100%;font-family:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--g2);background:#fff;color:var(--ink)}

.m{border:1px solid var(--g2);border-top:4px solid var(--navy);padding:9px 11px;min-width:0}
.m.ok{border-top-color:var(--ok)}.m.warn{border-top-color:var(--yellow)}.m.bad{border-top-color:var(--red)}
.m b{display:block;font-family:Georgia,serif;font-size:1.5em;color:var(--navy);line-height:1.05;word-break:break-word}
.m span{font-size:.75em;color:var(--g4);display:block;margin-top:3px;line-height:1.3}
.m i{font-size:.72em;font-style:normal;display:block;margin-top:4px;font-weight:bold;line-height:1.3}
.m i.ok{color:var(--ok)}.m i.warn{color:var(--warn)}.m i.bad{color:var(--bad)}

.verdict{border-left:6px solid var(--navy);background:var(--g1);padding:12px 15px;margin:15px 0}

table{border-collapse:collapse;width:100%;font-size:.87em;margin:8px 0 4px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--g2);vertical-align:top}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.box{border:1px solid var(--g2);padding:12px 15px;margin:13px 0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}

.chart{margin:10px 0}
svg{max-width:100%;height:auto;display:block}

.dec{border:1px solid var(--g2);border-left:5px solid var(--navy);padding:11px 14px;margin:11px 0}
.dec h4{margin:0 0 3px;font-size:1em}
.dec .q{font-size:.86em;color:var(--g4);margin-bottom:6px}
.dec .cons{font-size:.86em;background:var(--g1);padding:7px 10px;border-left:3px solid var(--yellow)}

/* .hcard span and .m span out-specify .tag and were shrinking it to 8.4px */
.hcard span.tag,.m span.tag,.hint span.tag,.hb span.tag{font-size:10.5px;line-height:1.5}
.grp>h5 i{color:var(--navy)}
footer.bty{margin-top:46px;border-top:1px solid var(--g2);padding-top:0}
.band{background:var(--navy);color:#fff;padding:9px 15px;display:flex;flex-wrap:wrap;
 justify-content:space-between;align-items:center;gap:8px;font-size:11.5px}
.band b{font-family:Georgia,serif;color:var(--yellow);font-size:12.5px}
.band i{font-style:italic;opacity:.82}

/* presentation mode */
body.pres{--fs:19px}
body.pres .rail{display:none}
body.pres .shell{display:block;max-width:1120px}
body.pres .main{padding-top:26px}
body.pres .ana{display:none}
body.pres .metrics{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
body.pres h2{margin-top:1.9em;padding-top:.5em;border-top:1px solid var(--g2)}
body.pres table{font-size:.8em}
.presonly{display:none}
body.pres .presonly{display:block}

@media print{
 .gnav,.rail{display:none}.shell{display:block;max-width:none;padding:0}
 body{--fs:11pt}.m,.box,.verdict,table{break-inside:avoid}h2{break-after:avoid}
}

<script>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ============================================================ MEASURED

const CCA=[
 {id:'bad',nm:'Badminton',cat:'S',lock:null,n:55,g:.50},

/* ============================================================ MODEL */
function model(){
  const M={};
  /* --- cohort, level by level --- */
  M.levelsArr=[{n:'Sec 1',pop:S.p1,cls:S.c1},{n:'Sec 2',pop:S.p2,cls:S.c2},
               {n:'Sec 3',pop:S.p3,cls:S.c3},{n:'Sec 4',pop:S.p4,cls:S.c4}];
  if(S.levels===5) M.levelsArr.push({n:'Sec 5',pop:S.p5,cls:1});
  M.levelsArr.forEach(L=>L.size=L.cls>0?L.pop/L.cls:0);
  M.N = M.levelsArr.reduce((s,L)=>s+L.pop,0);
  M.houseSize = M.N/S.houses;
  M.classesTotal = M.levelsArr.reduce((s,L)=>s+L.cls,0);
  M.classSize = M.classesTotal>0 ? M.N/M.classesTotal : 0;
  M.bigClass = Math.max(...M.levelsArr.map(L=>L.size));
  M.overCap = M.levelsArr.filter(L=>L.size>40);

  /* --- class nesting, computed per level from the real class counts --- */
  M.perLevel = M.levelsArr.map(L=>{
    const q=Math.floor(L.cls/S.houses), r=L.cls%S.houses;
    const big=(r>0?q+1:q)*L.size, small=q*L.size;
    return {...L,q,r,big,small,gap: small>0 ? (big-small)/small : (r>0?1:0)};
  });
  M.levelGap = Math.max(0,...M.perLevel.map(L=>L.gap));
  M.nestClean = M.perLevel.every(L=>L.r===0);
  M.worstLevel = M.perLevel.find(L=>L.gap===M.levelGap) || M.perLevel[0];

  /* Assign whole form classes to houses so total headcount is as even as
     possible. Longest-processing-time greedy: repeatedly give the next largest
     class to whichever house is currently smallest. This is what a registration
     officer would do by hand, and it is within a class of optimal. */
  const pool=[];
  M.levelsArr.forEach(L=>{ for(let i=0;i<L.cls;i++) pool.push({lvl:L.n,size:L.size}); });
  pool.sort((a,b)=>b.size-a.size);
  M.houseLoad = Array.from({length:S.houses},()=>({n:0,cls:0,byLevel:{}}));
  pool.forEach(c=>{
    const h=M.houseLoad.reduce((a,b)=>a.n<=b.n?a:b);
    h.n+=c.size; h.cls++; h.byLevel[c.lvl]=(h.byLevel[c.lvl]||0)+1;
  });
  const loads=M.houseLoad.map(h=>h.n);
  M.hMax=Math.max(...loads); M.hMin=Math.min(...loads);
  M.totalGap = M.hMin>0 ? (M.hMax-M.hMin)/M.hMin : 0;
  if(S.arch!=='class'){ M.levelGap=0; M.totalGap=0; M.nestClean=true;
    M.houseLoad=M.houseLoad.map(()=>({n:M.houseSize,cls:M.classesTotal/S.houses,byLevel:{}})); }

  /* --- band capacity and choice --- */
  M.bandDays = S.cycles*S.sessions;                  // per track (Wed), per year
  M.actualDays = M.bandDays*S.protect/100;
  /* Supply. Only a handful of teachers are on duty on a band day, so groups are
     mostly student led with a teacher supervising several at once, present in
     the building rather than in the room. */
  M.adultRun = Math.max(0, Math.floor(Math.min(S.adultRun, S.duty)));
  M.supervisors = Math.max(0, Math.floor(S.duty) - M.adultRun);
  M.supervised = Math.floor(M.supervisors*S.superRatio);
  M.staffable = Math.max(0, Math.floor(M.adultRun + M.supervised));
  // Rooms are a second ceiling. Quiet or paired work fits more than one group to
  // a room; the hall, ISH and the field hold several at once.
  M.roomCap = Math.max(0, Math.floor(S.rooms*S.perRoom));
  M.clusters = Math.max(0, Math.floor(Math.min(M.staffable, M.roomCap)));
  M.roomBound = M.roomCap < M.staffable;
  M.roomsNeeded = Math.ceil(Math.ceil(M.N/S.cluster)/Math.max(1,S.perRoom));
  M.capacity = M.clusters*S.cluster;
  M.coverage = M.N>0 ? M.capacity/M.N : 0;
  M.clustersNeeded = Math.ceil(M.N/S.cluster);
  M.clusterGap = M.clustersNeeded - M.clusters;
  // student leaders: how many, and what share of the upper secondary cohort
  M.running = Math.min(M.clusters, M.clustersNeeded);
  M.leadersNeeded = Math.max(0, M.running-M.adultRun)*S.leadersPer;
  M.leaderPool = S.p3+S.p4+(S.levels===5?S.p5:0);
  M.leaderRate = M.leaderPool>0 ? M.leadersNeeded/M.leaderPool : 0;
  // teachers needed if every group had an adult in the room, for contrast
  M.adultsIfAdultLed = M.clustersNeeded;
  M.dutyPerStudent = S.duty>0 ? M.N/S.duty : 0;
  const AL = allocate(M.clusters, S.cluster, M.N, S.skew);
  M.fcs = AL.fc; M.top2 = AL.top2; M.placed = AL.placed;
  M.topShare = AL.topShare;

  /* --- cadence, Gagne --- */
  M.weeks = S.cycles*S.sessions;
  M.months = M.weeks/4.33;
  M.perMonth = M.months>0 ? M.actualDays/M.months : 0;
  M.gagneOk = M.perMonth>=3;
  M.contactHrs = M.actualDays*S.hours;

  /* --- talent tiers --- */
  M.explore = M.N;
  M.build = Math.round(M.N*S.takeup/100);
  M.pursueN = Math.round(M.N*S.pursue/100);
  M.mentorsNeeded = Math.ceil(M.pursueN/Math.max(1,S.mentorLoad));
  M.thuClusters = Math.ceil(M.build/S.cluster);
  M.pool = S.houseOwns ? M.N/S.houses : M.N;
  M.poolTop = Math.round(M.pool*0.1);
  M.fragLoss = S.houseOwns ? 1-1/S.houses : 0;

  /* --- adult supply --- */
  M.supply = S.duty;
  M.demandWed = Math.ceil(M.clustersNeeded/Math.max(1,S.superRatio));   // supervisors needed
  M.demandThu = Math.ceil(M.thuClusters/Math.max(1,S.superRatio));
  M.supplyGapWed = M.demandWed - S.duty;
  M.supplyGapThu = M.demandThu - S.duty;
  M.staffPerHouse = S.teachers/S.houses;
  M.dutyPerHouse = S.duty/S.houses;
  M.tutorRatio = M.houseSize/Math.max(1,S.tutors);
  M.teacherHrs = M.actualDays*S.hours*2;
  // how often a given teacher is on band duty across the year
  M.dutyShare = S.teachers>0 ? (S.duty*M.actualDays*2)/S.teachers : 0;

  /* --- what the Setup tab assigns, made consequential ---------------------
     Anchors decide how much of a house can actually join its own flagships,
     and talent areas decide which house stewards which activity. Both feed
     the affinity index, the verdict and the Activities tab. */
  const HL = houseList();
  M.hAnchor = HL.map(h=>{
    const st=S.hset[h.k]||{};
    // a slot only counts if what sits in it is still that kind of CCA, so moving
    // Wushu between Sport and Performing Art empties a slot rather than lying
    const valid=[[st.s,c=>isSport(c)],[st.u,c=>c.cat==='UG'],[st.p,c=>isPA(c)]]
      .map(([id,ok])=>{const c=id?CC(id):null; return (c&&ok(c))?c:null;});
    const cs=valid.filter(Boolean);
    const slots=S.anchors?3:0;
    const missing=Math.max(0,slots-cs.length);
    // a gender-locked flagship is closed to roughly half the house
    const reach = cs.length? cs.reduce((a,c)=>a+(c.lock?0.5:1),0)/Math.max(1,slots) : 0;
    const roll = cs.reduce((a,c)=>a+c.n,0);
    const girls = roll? cs.reduce((a,c)=>a+c.g*c.n,0)/roll : .5;
    return {h,cs,missing,reach,roll,girls,dom:st.dom||'none'};
  });
  M.anchorReach = S.anchors && HL.length ? M.hAnchor.reduce((a,x)=>a+x.reach,0)/HL.length : 1;
  M.worstReach  = S.anchors && HL.length ? Math.min(...M.hAnchor.map(x=>x.reach)) : 1;
  M.unanchored  = S.anchors ? M.hAnchor.filter(x=>x.missing>0).length : 0;
  const gs = M.hAnchor.filter(x=>x.roll>0).map(x=>x.girls);
  M.anchorGenderSpread = (S.anchors && gs.length>1) ? Math.max(...gs)-Math.min(...gs) : 0;
  // talent areas: coverage and clashes
  const doms = M.hAnchor.map(x=>x.dom).filter(d=>d!=='none');
  M.domSet = new Set(doms);
  M.domDup = doms.length - M.domSet.size;
  M.domUncovered = DOMAINS.filter(d=>d.k!=='none'&&d.k!=='arts'&&!M.domSet.has(d.k)).length;

  /* --- activities --- */
  const on = ACTS.filter(a=>S.acts[a.id]);
  // which house stewards each activity, from the talent areas set on Setup
  M.steward = {};
  on.forEach(a=>{ const h=M.hAnchor.find(x=>x.dom===a.ta); if(h) M.steward[a.id]=h.h; });
  M.stewardLoad = {};
  HL.forEach(h=>M.stewardLoad[h.k]=on.filter(a=>M.steward[a.id]&&M.steward[a.id].k===h.k).length);
  const sl=Object.values(M.stewardLoad);
  M.stewardMax=sl.length?Math.max(...sl):0; M.stewardMin=sl.length?Math.min(...sl):0;
  M.unstewarded = on.filter(a=>a.ta!=='none'&&!M.steward[a.id]).length;
  M.actsOn = on;
  M.cupEvents = on.filter(a=>a.sc==='H').length;
  M.cupFree = on.filter(a=>a.sc==='H'&&a.free).length;
  M.actAdultSess = on.reduce((s,a)=>s+a.adults*Math.max(a.sess,1),0);
  M.actNew = on.filter(a=>!a.free).length;
  M.reach = Math.min(100, on.filter(a=>a.sc==='H').reduce((s,a)=>Math.max(s,a.part),0));
  // DREAM domain balance across Cup events
  M.dom={}; DREAM.forEach(([k])=>M.dom[k]=0);
  on.filter(a=>a.sc==='H').forEach(a=>[...a.dom].forEach(k=>{if(M.dom[k]!==undefined)M.dom[k]++;}));
  const dvals=DREAM.map(([k])=>M.dom[k]);
  const dmax=Math.max(...dvals), dmin=Math.min(...dvals);
  M.domBal = dmax>0 ? dmin/dmax : 0;
  M.domEmpty = dvals.filter(v=>v===0).length;

  /* --- Cup fairness --- */
  // size spread drives absolute-scoring bias
  const spread = M.totalGap;
  M.cupBias = S.cup==='absolute' ? spread : (S.cup==='percap' ? 0 : spread*0.15);
  M.cupFair = 1-M.cupBias;

  /* --- celebration / audience --- */
  M.audiencePer = S.showScope==='house' ? M.houseSize : M.N;
  M.witness = Math.min(1, S.showcases*M.audiencePer/Math.max(1,M.N));
  M.presenters = M.pursueN + Math.round(M.build*0.25);
  M.presentShare = M.presenters/Math.max(1,M.N);

  /* --- affinity index (MODELLED, illustrative) ---
     Calibrated so that a fully weekly, fully protected year at a tutor ratio of
     15 is the only way to reach 100. Two components are properties of the
     architecture and hold up even when delivery is thin, which is honest:
     class-anchored membership gives some belonging whatever Wednesday looks like. */
  const A=ARCH[S.arch];
  const c_persist = A.persist;
  const c_vert = S.levels>=5 ? 1 : .75;
  const c_contact = clamp(M.contactHrs/120,0,1);          // 40 weekly sessions x 3h = a full year
  const c_tutor = clamp(1-(M.tutorRatio-15)/45,0,1);      // 15 Beattyians per tutor is the benchmark
  const c_coh = A.cohesion;
  const c_ev = clamp(M.cupEvents/14,0,1);
  const c_place = M.placed;                                // belonging needs a place to belong to
  const c_anchor = M.anchorReach;                          // can you join your own house's flagships?
  M.affinity = Math.round(100*(c_persist*.13 + c_vert*.09 + c_contact*.22 + c_tutor*.11
                             + c_coh*.12 + c_ev*.09 + c_place*.14 + c_anchor*.10));
  M.affParts=[['Persistence in one house',c_persist],['Vertical span Sec 1 to '+(S.levels===5?'5':'4'),c_vert],
    ['Contact hours in the band',c_contact],['House tutor ratio',c_tutor],
    ['Daily reinforcement by form class',c_coh],['Inter-house event density',c_ev],
    ['Everyone actually placed',c_place],['Reach of your own flagships',c_anchor]];

  /* --- social mixing --- */
  M.newPeople = Math.max(0, M.houseSize - (S.arch==='class'? M.classSize : M.classSize/S.houses));
  M.mixScore = Math.round(100*A.mix);

  /* --- talent depth index ---
     Fragmentation is applied as a MULTIPLIER, not as one term among several.
     Capping every field's pool at a fifth of the school does not cost you a few
     points; it changes what the whole structure can produce, so it scales the
     entire index down. */
  const dose = clamp(M.perMonth/4.33,0,1);
  const pursueAdeq = clamp(S.pursue/17.5,0,1);             // Renzulli's pool is 15 to 20 percent
  const mentorF = clamp(M.supply/Math.max(1,M.mentorsNeeded+M.demandWed),0,1);
  M.poolF = S.houseOwns ? 1/Math.sqrt(S.houses) : 1;
  M.talent = Math.round(100*M.poolF*(dose*.40 + pursueAdeq*.25 + mentorF*.25 + M.top2*.10));
  M.talParts=[['Cadence against the Gagné line',dose],['Pursue tier size',pursueAdeq],
    ['Mentor and facilitator supply',mentorF],['Choice quality',M.top2]];

  /* --- strategy comparison --- */
  M.strat = stratScores(M);

  /* --- verdict --- */
  M.issues=[];
  if(S.arch==='class' && !M.nestClean)
    M.issues.push([M.totalGap>0.25?'b':'w',
      `No level divides cleanly into ${S.houses} houses. ${M.worstLevel.n} is the worst: ${M.worstLevel.cls} classes means ${M.worstLevel.r} house${M.worstLevel.r>1?'s':''} hold${M.worstLevel.r>1?'':'s'} ${M.worstLevel.q+1} classes and the rest hold ${M.worstLevel.q}, so at that level one house fields ${Math.round(M.worstLevel.big)} Beattyians against another's ${Math.round(M.worstLevel.small)}. Balancing whole classes across all ${S.levels} levels brings the school-wide spread down to ${pct(M.totalGap)}, but a carnival is contested at a level, not across the school.`]);
  if(M.overCap.length)
    M.issues.push(['w',`${M.overCap.map(L=>L.n).join(' and ')} would run at ${M.overCap.map(L=>Math.round(L.size)).join(' and ')} per form class. That is above the usual 40 cap, so either the class count for that level is higher than entered or the projection needs checking. It changes the nesting arithmetic either way.`]);
  if(M.coverage<1)
    M.issues.push(['b',`Band capacity covers only ${pct(M.coverage)} of Beattyians. ${cm(Math.round(M.N-M.capacity))} have nowhere to go on a Wednesday. You are running ${M.clusters} groups and need ${M.clustersNeeded}.`]);
  else if(M.top2<.8)
    M.issues.push(['w',`Only ${pct(M.top2)} get their first or second choice. Below 80 percent the catalogue is too narrow; add groups, not seats.`]);
  if(M.roomBound && M.clusters < M.clustersNeeded)
    M.issues.push(['w',`Rooms bind before staffing does. You could staff ${M.staffable} groups but ${S.rooms} rooms at ${S.perRoom} group${S.perRoom>1?'s':''} each hold only ${M.roomCap}. Either raise groups-per-room, which suits paired and quiet work, or run larger groups.`]);
  if(M.leaderRate>0.35)
    M.issues.push([S.model==='tutoring'?'g':'w',
      S.model==='tutoring'
      ? `${Math.round(M.leadersNeeded)} tutors, ${pct(M.leaderRate)} of Sec 3 and above. High by design: in cross-age tutoring the upper school <i>is</i> the teaching body, and Sec 1 and 2 number ${cm(S.p1+S.p2)} against ${cm(M.leaderPool)} potential tutors, so the ratio works.`
      : `${Math.round(M.leadersNeeded)} student leaders is ${pct(M.leaderRate)} of Sec 3 and above. A large standing corps to train and keep trained.`]);
  if(!M.gagneOk)
    M.issues.push(['w',`Cadence ${r1(M.perMonth)} sessions a month. Gagné dismisses provision at two or three a month as busywork. Below 3 you are running exposure, not talent development.`]);
  if(S.houseOwns)
    M.issues.push(['b',`Houses own the pathways, so every field's talent pool is capped at ${Math.round(M.pool)} Beattyians instead of ${cm(M.N)}. This inverts both Gagné and Renzulli at once.`]);
  if(M.supplyGapWed>0)
    M.issues.push(['b',`Wednesday needs ${M.demandWed} adults; supply is ${M.supply}. Short by ${M.supplyGapWed}. This is the binding constraint, not the pedagogy.`]);
  if(S.cup==='absolute' && M.totalGap>0.02)
    M.issues.push(['w',`Absolute Cup scoring with unequal houses hands the largest house a ${pct(M.cupBias)} structural advantage before anyone competes.`]);
  if(S.anchors && M.unanchored>0)
    M.issues.push(['w',`${M.unanchored} house${M.unanchored>1?'s have':' has'} an empty flagship slot. With Wushu counted as ${S.wushu==='S'?'a sport':'a performing art'} there are ${CCA.filter(isSport).length} sports, ${CCA.filter(c=>c.cat==='UG').length} uniformed groups and ${CCA.filter(isPA).length} performing arts for ${S.houses} houses.`]);
  if(S.anchors && M.worstReach<0.85)
    M.issues.push(['w',`Worst flagship reach ${pct(M.worstReach)}. At least one house flies a gender-locked CCA, so a large part of its own membership cannot join what it flies. Beatty has three boys-only CCAs against one girls-only, so this is structural rather than bad luck.`]);
  if(M.domDup>0)
    M.issues.push(['b',`${M.domDup} talent area${M.domDup>1?'s are':' is'} stewarded by more than one house. Each area should have exactly one steward, or nobody owns it.`]);
  if(M.unstewarded>0)
    M.issues.push(['w',`${M.unstewarded} activit${M.unstewarded>1?'ies have':'y has'} no stewarding house, because no house holds their talent area. Assign the area on the Model tab or accept that nobody owns them.`]);
  if(M.stewardMax-M.stewardMin>4)
    M.issues.push(['w',`Stewarding is lopsided: one house owns ${M.stewardMax} activities and another ${M.stewardMin}. Rebalance the talent areas or the workload follows the assignment.`]);
  if(M.domEmpty>0)
    M.issues.push(['w',`${M.domEmpty} of the five DREAM domains carry no Cup event. The Cup cannot score what nothing measures.`]);
  if(S.levels===4)
    M.issues.push(['w','Sec 5 sits outside the house band. A vertical house that stops early has no senior tier to lead it, which is the one job the vertical structure exists to do.']);
  if(S.protect<70)
    M.issues.push(['w',`Only ${S.protect} percent of band days survive. Oral examinations alone took ${AUD.bandTop[0][1]} entries over two years.`]);
  if(M.issues.length===0) M.issues.push(['g','No structural blocker at these settings. Every remaining risk is about delivery, not arithmetic.']);
  M.ok = !M.issues.some(i=>i[0]==='b');
  return M;
}

/* Allocation model. N Beattyians rank C clusters; popularity of rank i is
   proportional to 1/i^skew (a Zipf distribution), and each cluster seats `cap`.
   Students who miss their first choice are re-offered the clusters that still
   have space, in proportion to how popular those are, and so on. This mirrors
   Renzulli's mechanic, where students rank several choices rather than one.
   Returns: fc share placed at first choice, top2 at first or second, placed at all. */
function allocate(C,cap,N,skew){
  C=Math.floor(C); cap=Math.max(0,cap);
  if(!isFinite(C)||C<1||!isFinite(N)||N<=0||cap<=0) return {fc:0,top2:0,placed:0,topShare:0};
  let H=0; for(let i=1;i<=C;i++) H+=1/Math.pow(i,skew);
  const pop=[]; for(let i=1;i<=C;i++) pop.push((1/Math.pow(i,skew))/H);
  const remain=new Array(C).fill(cap);
  let un=N, round=0; const got=[];
  while(un>0.5 && round<15){
    const open=[]; let ph=0;
    for(let i=0;i<C;i++) if(remain[i]>1e-6){ open.push(i); ph+=pop[i]; }
    if(!open.length || ph<=0) break;
    let placedThis=0;
    const want=open.map(i=>un*pop[i]/ph);
    open.forEach((i,j)=>{ const s=Math.min(want[j],remain[i]); remain[i]-=s; placedThis+=s; });
    if(placedThis<=1e-9) break;
    got.push(placedThis); un-=placedThis; round++;
  }
  return {fc:clamp((got[0]||0)/N,0,1), top2:clamp(((got[0]||0)+(got[1]||0))/N,0,1),
          placed:clamp((N-un)/N,0,1), topShare:pop[0]||0};
}

function stratScores(M){
  // four strategies scored on the same five outcomes, 0-100. MODELLED.
  const full={bel:M.affinity, tal:M.talent, cel:Math.round(M.witness*100),
    cost:Math.round(clamp(M.demandWed/Math.max(1,M.supply),0,2)*50), risk:0};
  const o={};
  o.none={n:STRAT.none.n, bel:22, tal:14, cel:8, cost:0, risk:10,
    note:'The band keeps offering '+AUD.meanOptions+' options a level-day and dies before Term 4. Nothing gets worse. Nothing gets better.'};
  o.band={n:STRAT.band.n, bel:30, tal:Math.round(full.tal*.85), cel:Math.round(full.cel*.45), cost:Math.round(full.cost*.8), risk:35,
    note:'Cheapest real gain. Fixes cadence and choice without touching identity. Produces excellence that nobody watches.'};
  o.house={n:STRAT.house.n, bel:Math.round(full.bel*.9), tal:18, cel:Math.round(full.cel*.7), cost:Math.round(full.cost*.35), risk:30,
    note:'Belonging without depth. Houses are an environmental catalyst in Gagné; they develop nothing on their own.'};
  o.full={n:STRAT.full.n, bel:full.bel, tal:full.tal, cel:full.cel, cost:full.cost, risk:60,
    note:'The only option where the house supplies the audience that Renzulli Type III requires. Also the only one that can fail on facilitator supply.'};
  return o;
}

const esc=s=>String(s).replace(/&(?!\w+;)/g,'&amp;').replace(/</g,'&lt;');

function hbar(rows,opts={}){

function gauge(v,label,colour){

function radar(items,size=210){
  const cx=size/2, cy=size/2, R=size/2-32, n=items.length;
  let poly='',axes='',labs='';
  items.forEach((it,i)=>{
    const a=-Math.PI/2 + i*2*Math.PI/n;
    const px=cx+R*Math.cos(a), py=cy+R*Math.sin(a);
    const vx=cx+R*clamp(it[1],0,1)*Math.cos(a), vy=cy+R*clamp(it[1],0,1)*Math.sin(a);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#E4E6EC"/>`;
    poly+=`${vx},${vy} `;
    const lx=cx+(R+16)*Math.cos(a), ly=cy+(R+16)*Math.sin(a);
    labs+=`<text x="${lx}" y="${ly+3}" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#5b5f6b">${esc(it[0])}</text>`;
  });
  let rings='';[0.25,0.5,0.75,1].forEach(f=>{
    let p='';items.forEach((it,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;p+=`${cx+R*f*Math.cos(a)},${cy+R*f*Math.sin(a)} `;});
    rings+=`<polygon points="${p}" fill="none" stroke="#E4E6EC"/>`;});
  return svgWrap(size,size,rings+axes+`<polygon points="${poly}" fill="rgba(0,12,83,.17)" stroke="#000C53" stroke-width="2"/>`+labs);
}

/* ============================================================ SIMULATION
   Compute the model under a hypothetical set of settings without disturbing the
   live ones. Everything on the Explore tab is built on this. */
function simulate(patch){
  const saved=S;
  S=Object.assign(JSON.parse(JSON.stringify(saved)),patch||{});
  let m; try{ m=model(); } finally { S=saved; }
  return m;
}

function lineChart(pts,opts={}){
  const w=opts.w||520,h=opts.h||190,pad=38,padR=14,padT=12,padB=26;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1-y0<1e-6){y0-=1;y1+=1;}
  const X=v=>pad+(v-x0)/((x1-x0)||1)*(w-pad-padR);
  const Y=v=>h-padB-(v-y0)/((y1-y0)||1)*(h-padT-padB);
  let g='<g font-family="Calibri,sans-serif" font-size="10" fill="#5b5f6b">';
  [0,.5,1].forEach(f=>{const v=y0+f*(y1-y0),y=Y(v);
    g+=`<line x1="${pad}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#E4E6EC"/>`+
       `<text x="${pad-5}" y="${y+3}" text-anchor="end">${opts.fy?opts.fy(v):r1(v)}</text>`;});
  g+=`<text x="${pad}" y="${h-6}">${opts.fx?opts.fx(x0):x0}</text>`+
     `<text x="${w-padR}" y="${h-6}" text-anchor="end">${opts.fx?opts.fx(x1):x1}</text>`+
     `<text x="${(pad+w-padR)/2}" y="${h-6}" text-anchor="middle" fill="#9aa0ae">${esc(opts.xlab||'')}</text></g>`;
  const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  g+=`<path d="${d}" fill="none" stroke="#000C53" stroke-width="2.2"/>`;
  if(opts.mark!==undefined){
    const mx=X(opts.mark), my=Y(opts.markY);
    g+=`<line x1="${mx}" y1="${padT}" x2="${mx}" y2="${h-padB}" stroke="#EC3237" stroke-dasharray="3 3"/>`+
       `<circle cx="${mx}" cy="${my}" r="4.5" fill="#EC3237"/>`;
  }
  if(opts.thresh!==undefined){const ty=Y(opts.thresh);
    g+=`<line x1="${pad}" y1="${ty}" x2="${w-padR}" y2="${ty}" stroke="#b8860b" stroke-dasharray="4 3"/>`;}
  return svgWrap(w,h,g);
}
function tornado(rows,w=560){
  // rows: [label, lowVal, highVal, baseVal]
  const rh=22,lw=176,h=rows.length*rh+22;
  const base=rows.length?rows[0][3]:0;
  const span=Math.max(1,...rows.map(r=>Math.max(Math.abs(r[1]-base),Math.abs(r[2]-base))));
  const mid=lw+(w-lw-56)/2, half=(w-lw-56)/2;
  let g='<g font-family="Calibri,sans-serif" font-size="11">';
  g+=`<line x1="${mid}" y1="6" x2="${mid}" y2="${h-14}" stroke="#9aa0ae"/>`;
  rows.forEach((r,i)=>{
    const y=i*rh+8;
    const lo=(r[1]-base)/span*half, hi=(r[2]-base)/span*half;
    const a=Math.min(lo,hi), b=Math.max(lo,hi);
    g+=`<text x="${lw-6}" y="${y+13}" text-anchor="end" fill="#5b5f6b">${esc(r[0])}</text>`;
    g+=`<rect x="${mid+a}" y="${y+2}" width="${Math.max(1.5,b-a)}" height="${rh-8}" fill="${b-a>span*0.35?'#000C53':'#9aa0ae'}"/>`;
    g+=`<text x="${w-50}" y="${y+13}" fill="#1a1c22" font-weight="bold">${r[4]}</text>`;
  });

<li><b>Reorganisation raises participation.</b> 119 funded high schools: no achievement trend, but more extracurricular participation, higher promotion, fewer violent incidents.</li>
<li><b>Vertical grouping has consistent qualitative support.</b> Fewer in-year cliques, older students modelling behaviour, tutors attending to four Sec 1s rather than thirty.</li>
<li><b>Two Singapore precedents run it already.</b> Kranji allocates house with class at Sec 1. Hua Yi added a fifth house in 2020 to integrate classes into houses.</li>

<div class="box nav"><h4>Honest, against</h4><ul class="t">
<li><b>No randomised evidence houses raise attainment.</b> Adopt it as a culture and participation structure, or not at all.</li>
<li><b>Enrichment effects are softer than they look.</b> 0.68 on achievement, falling to 0.32 corrected for publication bias. Largest effects come from residential formats, not weekly bands.</li>
<li><b>Neither Renzulli nor Gagné appears in MOE guidance.</b> Singapore's language is school-based talent development and higher-ability learners. Say you are importing a framework rather than let it be discovered.</li>
<li><b>Complex whole-school change needs two years minimum.</b> EEF's failure modes map uncomfortably well: initiative overload, implementation dip, over-reliance on individuals, neglected de-implementation.</li>
<li><b>Teacher disengagement is the measured variance.</b> 25 percent staff disengagement produced performance disparities between houses.</li>

<p>Class-anchored wins because <b>every inter-class competition is already an inter-house competition</b>, so the Cup fills from events already running. It also survives FSBB: only six common-curriculum subjects hold a form class together, so a house keyed to form class is stable where one keyed to banding would fragment.</p>
<p>The cost: <b>house composition inherits class composition.</b> ${Math.round(ARCH.class.mix*100)} on social mixing against ${Math.round(ARCH.random.mix*100)} for random sorting. If a class arrives with a social problem, the house holds it for four years.</p></div>

<div class="box"><h4>Boon Lay runs the model we score lowest <span class="tag res">researched</span></h4>
<p>Four houses &mdash; Garnet, Emerald, Morganite, Sapphire &mdash; each owning four CCAs, from 2017. A working Singapore instance of CCA-anchoring.</p>
<p>Our four objections: CCA rolls are uneven (Concert Band and NPCC roughly double Wushu and Football); gender is structural, three boys-only against one girls-only; CCAs thin at upper secondary so the column narrows where Sec 3 and 4 leaders should be; class nesting drops to zero. Philosophically it is also the Hogwarts move &mdash; sorting by talent on arrival.</p>
<p class="note"><b>Call Boon Lay before this reaches the SMC.</b> One conversation settles whether those objections bite in practice. Cheapest evidence available to this project.</p></div>

<p class="note">Running <b>${MODELS[S.model]?MODELS[S.model].n:'—'}</b>. ${MODELS[S.model]?MODELS[S.model].d:''} Change it from the rail or on Explore and every figure on this page moves.</p>

<div class="chart">${hbar(supplyRows,{w:620,lw:250,rh:23})}</div>

<div class="verdict ${M.clusterGap>0?'bad':'ok'}"><h3>The pivot this forces, and why it is an improvement</h3>
<ul>
<li class="${M.clusterGap>0?'b':'g'}"><b>Adult-led is arithmetically dead.</b> ${cm(M.N)} Beattyians in groups of ${S.cluster} needs ${M.clustersNeeded} rooms at once; ${S.duty} duty teachers staff ${S.duty}. Every framework in the literature assumes an adult per group and none survives this ratio.</li>
<li class="g"><b>Student-led with roaming supervision closes it.</b> ${M.supervisors} teacher${M.supervisors===1?'':'s'} covering ${S.superRatio} groups each gives ${M.supervised}, plus ${M.adultRun} run directly = ${M.clusters}. In the building, circulating, not in the room &mdash; exactly what the school described.</li>
<li class="g"><b>The cost is a leadership corps, and that is the point.</b> ${Math.round(M.leadersNeeded)} student leaders, ${pct(M.leaderRate)} of Sec 3 and above. Not overhead: the largest leadership programme the school could run, with LEAPS Leadership credit for every one.</li>
<li class="w"><b>It demands preparation, not teacher hours.</b> An untrained student-led group is a free period. Training ${Math.round(M.leadersNeeded)} leaders is the real cost, and it falls in Term 4 and at each cycle start, not every Wednesday.</li>
</ul></div>

<h2>The band is already the school's own meeting time <span class="tag mea">measured</span></h2>
<p class="lede">Not in the written report, and it explains the ten-teacher ceiling. Of ${AUD.inBand} in-band records, <b>${AUD.inBandStaff} are not student-facing at all</b>.</p>
<div class="chart scroll">${hbar(AUD.staffUse.map(r=>[r[0],r[1],'#EC3237',r[1]]),{w:600,lw:238,rh:20})}</div>
<p class="note">The ten-teacher figure is not a lack of goodwill: <b>the other eighty are in meetings that also live in this slot.</b> Any proposal assuming teachers are free on Wednesday afternoons competes with the school's own governance calendar and loses.</p>
<p class="note"><b>Two questions for the SMC.</b> If the band becomes a student-activity block, where does department PD go? And: the student-led model is the only one that lets both happen in the same slot, which turns the constraint into the argument.</p>

<div class="grid2">
<div><h3>Who owns the band today? Nobody. <span class="tag mea">measured</span></h3>
<div class="chart">${hbar(AUD.deptTag.map(r=>[r[0],r[1],r[1]>200?'#EC3237':'#000C53',r[1]]),{w:480,lw:200,rh:20})}</div>
<p class="note"><b>${AUD.deptTag[0][1]} of ${AUD.inBandEnrich}</b> student-facing enrichment records carry no department tag. The band is unclaimed, not contested &mdash; easier to redesign than if four departments were defending it, and it explains how the slot fell to 1.33 a level-day unnoticed.</p></div>

<div><h3>How to structure the house team</h3>
<div class="scroll"><table><thead><tr><th scope="col">Role</th><th scope="col" class="n">Per house</th><th scope="col">What they own</th></tr></thead><tbody>
<tr><td><b>Head of House</b></td><td class="n">1</td><td>The house's development and its Cup campaign. A middle-management line, not an add-on to a full teaching load.</td></tr>
<tr><td><b>Assistant Head</b></td><td class="n">1</td><td>Wednesday cluster logistics and the house exco. The succession line.</td></tr>
<tr><td><b>House Tutors</b></td><td class="n">${S.tutors}</td><td>A vertical tutor group each, ${Math.round(M.tutorRatio)} Beattyians spanning Sec 1 to ${S.levels}. Owns the Total Talent Portfolio conversation and follows the same students for ${S.levels} years.</td></tr>
<tr><td><b>Duty teachers</b></td><td class="n">${r1(M.dutyPerHouse)}</td><td>On the floor on a band day, roaming ${S.superRatio} student-led groups each. Rotated across the ${S.teachers}-strong establishment so no one carries it weekly.</td></tr>
<tr><td><b>Student group leaders</b></td><td class="n">${Math.round(M.leadersNeeded/S.houses)}</td><td>Sec 3 and 4 Beattyians, ${S.leadersPer} to a group, trained in Term 4 and at each cycle start. This is the leadership programme, not a workaround.</td></tr>

<p class="note">Note the last row. Pathway mentors report to the field, not the house. That is the structural expression of the rule that houses own belonging and fields own pursuit &mdash; if mentors sat inside houses, the talent pool would fragment through the staffing chart even if the policy said otherwise.</p></div>
</div>

<h2>Vertical tutoring, and what makes it fail <span class="tag res">researched</span></h2>
<div class="grid2">
<div class="box nav"><h4>What it buys</h4><ul class="t">
<li>Fewer in-year cliques; friendships across year groups.</li>
<li>Older students model behaviour because they feel a duty to.</li>
<li>A tutor attends to four Sec 1s in September, not thirty.</li>
<li>No hierarchy by year, so belonging does not depend on seniority.</li>
</ul></div>
<div class="box" style="border-left:4px solid var(--red)"><h4>What makes it fail</h4><ul class="t">
<li>Treating it as "just mixing up the kids". Without training and an explicit rationale it becomes a differently shaped registration period.</li>
<li><b>25 percent teacher disengagement produced performance disparities between houses.</b> A house with a disengaged Head is a visibly losing house full of students who notice.</li>
<li>It needs regular short sessions. If the only contact is the Wednesday band, that is ${Math.round(M.actualDays)} days a year and the "tutor who follows you for ${S.levels} years" is notional.</li>
</ul></div>
</div>

<div class="box"><h4>What are you stopping? EEF says you must answer this</h4>
<p><b>${AUD.prog1or2} of ${AUD.programmes} programmes ran once or twice across two years.</b> Retiring them is the fastest way to free adults: every one-off consumed planning time from someone who could run a ten-session group instead.</p>
<p class="note">Ask each department: <i>convert</i>, <i>rebuild</i> or <i>retire</i>? Publishing the 1.33 figure and the ten empty coverage cells is what makes that conversation possible. Term 4 job, costs nothing.</p></div>`;
}

/* ============================================================ RENDER
   Re-rendering #main throws away its DOM, so anything focused inside it is lost
   and the page would jump. Keep the scroll position and restore focus to the
   same control unless the tab actually changed. */
function render(opts){
  const toTop = !!(opts && opts.top);
  const y = window.scrollY;
  const ae = document.activeElement;
  let refocus=null;
  if(ae && ae!==document.body && $('#main').contains(ae)){
    if(ae.dataset.h) refocus=`#main select[data-h="${ae.dataset.h}"][data-f="${ae.dataset.f}"]`;
    else if(ae.dataset.a) refocus=`#main input[data-a="${ae.dataset.a}"]`;
  }
  /* Restoring a pixel offset is not enough: a verdict line appearing, or the
     activities table shrinking, changes the height of everything above you, and
     when the page gets shorter the browser clamps the scroll and the position
     ratchets upward. Anchor to the section heading you are actually reading
     instead. h2 count is fixed per tab, so the index survives a re-render. */
  const anc = toTop ? null : anchorNow();
  const M=model();
  $$('.gnav a[data-t]').forEach(a=>a.classList.toggle('on',a.dataset.t===S.tab));
  $('#sbar').innerHTML = statusBar(M);
  $('#main').innerHTML = TABS[S.tab](M) + footer();
  syncRail();
  $$('#main input[data-a]').forEach(cb=>cb.onchange=()=>{S.acts[cb.dataset.a]=cb.checked?1:0;render();});
  // setup tab controls
  $$('#main select[data-h]').forEach(sel=>sel.onchange=()=>{
    S.hset[sel.dataset.h][sel.dataset.f]=sel.value; render();});
  $$('#main [data-set]').forEach(b=>b.onclick=()=>{
    const [k,v]=b.dataset.set.split(':'); S[k]= (k==='wushu')? v : +v;
    if(k==='wushu') fixAnchors();
    render();});
  $$('#main [data-arch]').forEach(b=>b.onclick=()=>{S.arch=b.dataset.arch;render();});
  $$('#main [data-model]').forEach(b=>b.onclick=()=>{applyModel(b.dataset.model);});
  $$('#main [data-out]').forEach(b=>b.onclick=()=>{S.outcome=b.dataset.out;render();});
  $$('#main [data-sweep]').forEach(b=>b.onclick=()=>{S.sweep=b.dataset.sweep;render();});
  $$('#main [data-mx]').forEach(c=>c.onclick=()=>{
    const [a,h]=c.dataset.mx.split(':'); S.arch=a; S.houses=+h; render();});
  $$('#main [data-save]').forEach(b=>b.onclick=()=>{
    if(b.dataset.save==='clear') SCEN=[null,null,null,null];
    else SCEN[+b.dataset.save]=JSON.parse(JSON.stringify(S));
    render();});
  const aa=$('#autoAnchor'); if(aa) aa.onclick=()=>{autoAnchor();render();};
  if(toTop) window.scrollTo({top:0});
  else {
    if(refocus){ const el=$(refocus); if(el) el.focus({preventScroll:true}); }
    restoreAnchor(anc,y);
    // Chrome re-runs its own scroll anchoring after the frame in which the
    // subtree was replaced, which undoes the restore. Correct again next frame.
    requestAnimationFrame(()=>restoreAnchor(anc,y));
  }
}
/* The last section heading at or above the top of the viewport, plus how far
   above it sits. Null when you are still above the first heading. */
function anchorNow(){
  const hs=$$('#main h2');
  for(let i=hs.length-1;i>=0;i--){
    const t=hs[i].getBoundingClientRect().top;
    if(t<=80) return {i,t};
  }
  return null;
}
function restoreAnchor(anc,y){
  if(!anc){ window.scrollTo({top:y}); return; }
  const hs=$$('#main h2');
  const el=hs[anc.i];
  if(!el){ window.scrollTo({top:y}); return; }
  const delta=el.getBoundingClientRect().top-anc.t;
  if(Math.abs(delta)>0.5) window.scrollBy(0,delta);
}

/* Anchor helpers. Keep one Sport, one Uniformed Group and one Performing Art per
   house, all distinct, and drop any anchor that stopped being valid when Wushu
   moved between categories. */
function fixAnchors(){
  houseList().forEach(h=>{const st=S.hset[h.k];
    if(st.s && !isSport(CC(st.s))) st.s='';
    if(st.p && !isPA(CC(st.p))) st.p='';});
}
function autoAnchor(){
  const hs=houseList();
  const pools={s:CCA.filter(isSport).map(c=>c.id), u:CCA.filter(c=>c.cat==='UG').map(c=>c.id), p:CCA.filter(isPA).map(c=>c.id)};
  ['s','u','p'].forEach(slot=>{
    const used=new Set();
    hs.forEach(h=>{const v=S.hset[h.k][slot];
      if(v && pools[slot].includes(v) && !used.has(v)) used.add(v); else S.hset[h.k][slot]='';});
    hs.forEach(h=>{ if(S.hset[h.k][slot]) return;
      const free=pools[slot].find(x=>!used.has(x));
      if(free){ S.hset[h.k][slot]=free; used.add(free); }});
  });
}
/* Always-visible consequence line, so the effect of a control is never off-screen. */
let PREV=null;
function statusBar(M){
  const bad=M.issues.filter(i=>i[0]==='b').length, warn=M.issues.filter(i=>i[0]==='w').length;
  const cls=bad?'bad':(warn?'warn':'ok');
  const label=bad?`Fails · ${bad} blocker${bad>1?'s':''}`:(warn?`Holds · ${warn} warning${warn>1?'s':''}`:'Holds');
  // arrow showing which way a number just moved, so a change is never silent
  const arr=(k,now,fmt)=>{
    if(!PREV||PREV[k]===undefined) return '';
    const d=now-PREV[k];
    if(Math.abs(d)<1e-9) return '';
    return `<span class="dlt ${d>0?'up':'dn'}">${d>0?'▲':'▼'}${fmt?fmt(Math.abs(d)):Math.round(Math.abs(d))}</span>`;
  };
  const kv=(v,l,c,a)=>`<span class="kv ${c||''}"><b>${v}</b>${l}${a||''}</span>`;
  const html=`<span class="pill ${cls}">${label}</span>`+
    kv(cm(M.N),'Beattyians','',arr('N',M.N))+
    kv(M.running+'/'+M.clustersNeeded,'groups', M.clusters<M.clustersNeeded?'bad':'ok', arr('running',M.running))+
    kv(pct(M.top2),'1st or 2nd', M.top2>=.8?'ok':'', arr('top2',M.top2*100,v=>Math.round(v)+'pt'))+
    kv(r1(M.perMonth),'sess/month', M.perMonth>=3?'ok':'', arr('perMonth',M.perMonth,r1))+
    kv(Math.round(M.leadersNeeded),'student leaders','',arr('leadersNeeded',M.leadersNeeded))+
    kv(M.affinity,'affinity','',arr('affinity',M.affinity))+
    kv(M.talent,'talent','',arr('talent',M.talent))+
    `<span class="sp"></span><span class="mdl">${MODELS[S.model]?MODELS[S.model].n:''} · ${ARCH[S.arch].n} · ${S.houses} houses</span>`;
  PREV={N:M.N,running:M.running,top2:M.top2*100,perMonth:M.perMonth,
        leadersNeeded:M.leadersNeeded,affinity:M.affinity,talent:M.talent};
  return html;
}
function footer(){
  return `<footer class="bty"><div class="band">
   <b>Beatty Secondary School</b>
   <i>Non Vi Sed Arte &mdash; not by force but by skill</i>
   <span>Every Beattyian A Purpose Driven Steward</span></div>
   <div class="foot2">House Dashboard. <span class="tag mea">measured</span> comes from <code>references/enrichment-audit-2024-2025.xlsx</code>, 1,148 calendar events between 1 January 2024 and 31 December 2025, and from the MOE School Finder record.
   <span class="tag mod">modelled</span> is an adjustable control on this page and is never a measurement.
   <span class="tag res">researched</span> is from published sources outside Beatty.
   <span class="tag unk">unverified</span> is not published anywhere reachable.
   Composite indices are illustrative and exist to make trade-offs visible; they are not fit to quote.</div></footer>`;
}
