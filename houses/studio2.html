/* ============================================================ STATE */
const DEF={
  tab:'case', pres:0,
  cohort:200, classes:8, levels:4, houses:5, arch:'class',

  adults:16, cluster:20, skew:.8, twoTutor:0,
  pursue:15, takeup:60, mentorLoad:8, houseOwns:0,

  cup:'percap', showScope:'house', showcases:3,

  acts:ACTS.reduce((o,a)=>(o[a.id]=1,o),{})
};
let S=JSON.parse(JSON.stringify(DEF));
let SCEN=[null,null,null];

/* ============================================================ MODEL */
function model(){
  const M={};
  M.N = S.cohort*S.levels;
  M.houseSize = M.N/S.houses;
  M.classSize = S.cohort/S.classes;
  M.classesTotal = S.classes*S.levels;

  /* --- class nesting --- */
  const q=Math.floor(S.classes/S.houses), rem=S.classes%S.houses;
  M.q=q; M.rem=rem;
  M.nestClean = rem===0;
  // at a single level, rem houses hold q+1 classes
  M.levelMax = (rem>0? q+1 : q)*M.classSize;
  M.levelMin = q*M.classSize;
  M.levelGap = M.levelMin>0 ? (M.levelMax-M.levelMin)/M.levelMin : (rem>0?1:0);
  // across all levels, extras rotate
  const extras = rem*S.levels;
  const baseEach = Math.floor(extras/S.houses), extraHouses = extras%S.houses;
  M.houseClassMax = q*S.levels + baseEach + (extraHouses>0?1:0);
  M.houseClassMin = q*S.levels + baseEach;
  M.totalGap = M.houseClassMin>0 ? (M.houseClassMax-M.houseClassMin)/M.houseClassMin : 0;
  if(S.arch!=='class'){ M.levelGap=0; M.totalGap=0; M.nestClean=true; }

  /* --- band capacity and choice --- */
  M.bandDays = S.cycles*S.sessions;                  // per track (Wed), per year
  M.actualDays = M.bandDays*S.protect/100;
  M.clusters = Math.floor(S.adults/(S.twoTutor?2:1));
  M.capacity = M.clusters*S.cluster;
  M.coverage = M.N>0 ? M.capacity/M.N : 0;
  M.clustersNeeded = Math.ceil(M.N/S.cluster);
  M.adultsNeeded = M.clustersNeeded*(S.twoTutor?2:1);
  M.adultGap = M.adultsNeeded - S.adults;
  const AL = allocate(M.clusters, S.cluster, M.N, S.skew);
  M.fcs = AL.fc; M.top2 = AL.top2; M.placed = AL.placed;
  M.topShare = AL.topShare;

  /* --- cadence, Gagne --- */
  M.weeks = S.cycles*S.sessions;
  M.months = M.weeks/4.33;
  M.perMonth = M.months>0 ? M.actualDays/M.months : 0;
  M.gagneOk = M.perMonth>=3;
  M.contactHrs = M.actualDays*S.hours;

  /* --- talent tiers --- */
  M.explore = M.N;
  M.build = Math.round(M.N*S.takeup/100);
  M.pursueN = Math.round(M.N*S.pursue/100);
  M.mentorsNeeded = Math.ceil(M.pursueN/Math.max(1,S.mentorLoad));
  M.thuClusters = Math.ceil(M.build/S.cluster);
  M.pool = S.houseOwns ? M.N/S.houses : M.N;
  M.poolTop = Math.round(M.pool*0.1);
  M.fragLoss = S.houseOwns ? 1-1/S.houses : 0;

  /* --- adult supply --- */
  M.supply = Math.round(S.teachers*S.facilRate/100) + S.nonTeach;
  M.demandWed = M.clustersNeeded*(S.twoTutor?2:1);
  M.demandThu = M.thuClusters*(S.twoTutor?2:1);
  M.supplyGapWed = M.demandWed - M.supply;
  M.supplyGapThu = M.demandThu - M.supply;
  M.staffPerHouse = S.teachers/S.houses;
  M.tutorRatio = M.houseSize/Math.max(1,S.tutors);
  M.teacherHrs = M.actualDays*S.hours*2; // a teacher running both bands

  /* --- activities --- */
  const on = ACTS.filter(a=>S.acts[a.id]);
  M.actsOn = on;
  M.cupEvents = on.filter(a=>a.sc==='H').length;
  M.cupFree = on.filter(a=>a.sc==='H'&&a.free).length;
  M.actAdultSess = on.reduce((s,a)=>s+a.adults*Math.max(a.sess,1),0);
  M.actNew = on.filter(a=>!a.free).length;
  M.reach = Math.min(100, on.filter(a=>a.sc==='H').reduce((s,a)=>Math.max(s,a.part),0));
  // DREAM domain balance across Cup events
  M.dom={}; DREAM.forEach(([k])=>M.dom[k]=0);
  on.filter(a=>a.sc==='H').forEach(a=>[...a.dom].forEach(k=>{if(M.dom[k]!==undefined)M.dom[k]++;}));
  const dvals=DREAM.map(([k])=>M.dom[k]);
  const dmax=Math.max(...dvals), dmin=Math.min(...dvals);
  M.domBal = dmax>0 ? dmin/dmax : 0;
  M.domEmpty = dvals.filter(v=>v===0).length;

  /* --- Cup fairness --- */
  // size spread drives absolute-scoring bias
  const spread = M.totalGap;
  M.cupBias = S.cup==='absolute' ? spread : (S.cup==='percap' ? 0 : spread*0.15);
  M.cupFair = 1-M.cupBias;

  /* --- celebration / audience --- */
  M.audiencePer = S.showScope==='house' ? M.houseSize : M.N;
  M.witness = Math.min(1, S.showcases*M.audiencePer/Math.max(1,M.N));
  M.presenters = M.pursueN + Math.round(M.build*0.25);
  M.presentShare = M.presenters/Math.max(1,M.N);

  /* --- affinity index (MODELLED, illustrative) ---
     Calibrated so that a fully weekly, fully protected year at a tutor ratio of
     15 is the only way to reach 100. Two components are properties of the
     architecture and hold up even when delivery is thin, which is honest:
     class-anchored membership gives some belonging whatever Wednesday looks like. */
  const A=ARCH[S.arch];
  const c_persist = A.persist;
  const c_vert = S.levels>=5 ? 1 : .75;
  const c_contact = clamp(M.contactHrs/120,0,1);          // 40 weekly sessions x 3h = a full year
  const c_tutor = clamp(1-(M.tutorRatio-15)/45,0,1);      // 15 Beattyians per tutor is the benchmark
  const c_coh = A.cohesion;
  const c_ev = clamp(M.cupEvents/14,0,1);
  const c_place = M.placed;                                // belonging needs a place to belong to
  M.affinity = Math.round(100*(c_persist*.15 + c_vert*.10 + c_contact*.25 + c_tutor*.12
                             + c_coh*.13 + c_ev*.10 + c_place*.15));
  M.affParts=[['Persistence in one house',c_persist],['Vertical span Sec 1 to '+(S.levels===5?'5':'4'),c_vert],
    ['Contact hours in the band',c_contact],['House tutor ratio',c_tutor],
    ['Daily reinforcement by form class',c_coh],['Inter-house event density',c_ev],
    ['Everyone actually placed',c_place]];

  /* --- social mixing --- */
  M.newPeople = Math.max(0, M.houseSize - (S.arch==='class'? M.classSize : M.classSize/S.houses));
  M.mixScore = Math.round(100*A.mix);

  /* --- talent depth index ---
     Fragmentation is applied as a MULTIPLIER, not as one term among several.
     Capping every field's pool at a fifth of the school does not cost you a few
     points; it changes what the whole structure can produce, so it scales the
     entire index down. */
  const dose = clamp(M.perMonth/4.33,0,1);
  const pursueAdeq = clamp(S.pursue/17.5,0,1);             // Renzulli's pool is 15 to 20 percent
  const mentorF = clamp(M.supply/Math.max(1,M.mentorsNeeded+M.demandWed),0,1);
  M.poolF = S.houseOwns ? 1/Math.sqrt(S.houses) : 1;
  M.talent = Math.round(100*M.poolF*(dose*.40 + pursueAdeq*.25 + mentorF*.25 + M.top2*.10));
  M.talParts=[['Cadence against the Gagné line',dose],['Pursue tier size',pursueAdeq],
    ['Mentor and facilitator supply',mentorF],['Choice quality',M.top2]];

  /* --- strategy comparison --- */
  M.strat = stratScores(M);

  /* --- verdict --- */
  M.issues=[];
  if(S.arch==='class' && rem!==0)
    M.issues.push([M.totalGap>0.25?'b':'w',
      `${S.classes} form classes per level does not divide by ${S.houses}. At any single level, ${rem} house${rem>1?'s':''} hold${rem>1?'':'s'} a whole class more than the others, a ${pct(M.levelGap)} gap &mdash; and a single level is exactly where a carnival is contested. Across all ${S.levels} levels the extra classes rotate and the gap falls to ${pct(M.totalGap)}. Ten classes divides cleanly; eight does not.`]);
  if(M.coverage<1)
    M.issues.push(['b',`Band capacity covers only ${pct(M.coverage)} of Beattyians. ${cm(Math.round(M.N-M.capacity))} have no place on a Wednesday. You need ${M.adultsNeeded} adults and have ${S.adults}.`]);
  else if(M.top2<.8)
    M.issues.push(['w',`Only ${pct(M.top2)} get their first or second choice. Below 80 percent the catalogue is too narrow; add clusters, not seats.`]);
  if(!M.gagneOk)
    M.issues.push(['w',`Cadence ${r1(M.perMonth)} sessions a month. Gagné dismisses provision at two or three a month as busywork. Below 3 you are running exposure, not talent development.`]);
  if(S.houseOwns)
    M.issues.push(['b',`Houses own the pathways, so every field's talent pool is capped at ${Math.round(M.pool)} Beattyians instead of ${cm(M.N)}. This inverts both Gagné and Renzulli at once.`]);
  if(M.supplyGapWed>0)
    M.issues.push(['b',`Wednesday needs ${M.demandWed} adults; supply is ${M.supply}. Short by ${M.supplyGapWed}. This is the binding constraint, not the pedagogy.`]);
  if(S.cup==='absolute' && M.totalGap>0.02)
    M.issues.push(['w',`Absolute Cup scoring with unequal houses hands the largest house a ${pct(M.cupBias)} structural advantage before anyone competes.`]);
  if(M.domEmpty>0)
    M.issues.push(['w',`${M.domEmpty} of the five DREAM domains carry no Cup event. The Cup cannot score what nothing measures.`]);
  if(S.levels===4)
    M.issues.push(['w','Sec 5 sits outside the house band. A vertical house that stops early has no senior tier to lead it, which is the one job the vertical structure exists to do.']);
  if(S.protect<70)
    M.issues.push(['w',`Only ${S.protect} percent of band days survive. Oral examinations alone took ${AUD.bandTop[0][1]} entries over two years.`]);
  if(M.issues.length===0) M.issues.push(['g','No structural blocker at these settings. Every remaining risk is about delivery, not arithmetic.']);
  M.ok = !M.issues.some(i=>i[0]==='b');
  return M;
}

/* Allocation model. N Beattyians rank C clusters; popularity of rank i is
   proportional to 1/i^skew (a Zipf distribution), and each cluster seats `cap`.
   Students who miss their first choice are re-offered the clusters that still
   have space, in proportion to how popular those are, and so on. This mirrors
   Renzulli's mechanic, where students rank several choices rather than one.
   Returns: fc share placed at first choice, top2 at first or second, placed at all. */
function allocate(C,cap,N,skew){
  if(C<1||N<=0) return {fc:0,top2:0,placed:0,topShare:0};
  let H=0; for(let i=1;i<=C;i++) H+=1/Math.pow(i,skew);
  const pop=[]; for(let i=1;i<=C;i++) pop.push((1/Math.pow(i,skew))/H);
  const remain=new Array(C).fill(cap);
  let un=N, round=0; const got=[];
  while(un>0.5 && round<15){
    const open=[]; let ph=0;
    for(let i=0;i<C;i++) if(remain[i]>1e-6){ open.push(i); ph+=pop[i]; }
    if(!open.length || ph<=0) break;
    let placedThis=0;
    const want=open.map(i=>un*pop[i]/ph);
    open.forEach((i,j)=>{ const s=Math.min(want[j],remain[i]); remain[i]-=s; placedThis+=s; });
    if(placedThis<=1e-9) break;
    got.push(placedThis); un-=placedThis; round++;
  }
  return {fc:clamp((got[0]||0)/N,0,1), top2:clamp(((got[0]||0)+(got[1]||0))/N,0,1),
          placed:clamp((N-un)/N,0,1), topShare:pop[0]||0};
}

function stratScores(M){
  // four strategies scored on the same five outcomes, 0-100. MODELLED.
  const full={bel:M.affinity, tal:M.talent, cel:Math.round(M.witness*100),
    cost:Math.round(clamp(M.demandWed/Math.max(1,M.supply),0,2)*50), risk:0};
  const o={};
  o.none={n:STRAT.none.n, bel:22, tal:14, cel:8, cost:0, risk:10,
    note:'The band keeps offering '+AUD.meanOptions+' options a level-day and dies before Term 4. Nothing gets worse. Nothing gets better.'};
  o.band={n:STRAT.band.n, bel:30, tal:Math.round(full.tal*.85), cel:Math.round(full.cel*.45), cost:Math.round(full.cost*.8), risk:35,
    note:'Cheapest real gain. Fixes cadence and choice without touching identity. Produces excellence that nobody watches.'};
  o.house={n:STRAT.house.n, bel:Math.round(full.bel*.9), tal:18, cel:Math.round(full.cel*.7), cost:Math.round(full.cost*.35), risk:30,
    note:'Belonging without depth. Houses are an environmental catalyst in Gagné; they develop nothing on their own.'};
  o.full={n:STRAT.full.n, bel:full.bel, tal:full.tal, cel:full.cel, cost:full.cost, risk:60,
    note:'The only option where the house supplies the audience that Renzulli Type III requires. Also the only one that can fail on facilitator supply.'};
  return o;
}

const esc=s=>String(s).replace(/&(?!\w+;)/g,'&amp;').replace(/</g,'&lt;');
function svgWrap(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;}
function hbar(rows,opts={}){
  // rows: [label, value, colour, note]
  const w=opts.w||620, rh=opts.rh||21, pad=opts.lw||190, gap=3;
  const max=opts.max||Math.max(1,...rows.map(r=>r[1]));
  const h=rows.length*(rh+gap)+16;
  let s=`<g font-family="Calibri,sans-serif" font-size="11.5">`;
  rows.forEach((r,i)=>{
    const y=i*(rh+gap)+4, bw=Math.max(1,(r[1]/max)*(w-pad-70));
    s+=`<text x="${pad-7}" y="${y+rh*0.7}" text-anchor="end" fill="#5b5f6b">${esc(r[0])}</text>`;
    s+=`<rect x="${pad}" y="${y}" width="${bw}" height="${rh-4}" fill="${r[2]||'#000C53'}"/>`;
    s+=`<text x="${pad+bw+6}" y="${y+rh*0.7}" fill="#1a1c22" font-weight="bold">${esc(r[3]!==undefined?r[3]:r[1])}</text>`;
  });
  return svgWrap(w,h,s+`</g>`);
}
function gauge(v,label,colour){
  const w=150,h=76,cx=75,cy=62,rr=52;
  const a=Math.PI*(1-clamp(v,0,1));
  const x=cx+rr*Math.cos(a), y=cy-rr*Math.sin(a);
  const big=0;
  return svgWrap(w,h,
    `<path d="M ${cx-rr} ${cy} A ${rr} ${rr} 0 0 1 ${cx+rr} ${cy}" fill="none" stroke="#E4E6EC" stroke-width="12"/>`+
    `<path d="M ${cx-rr} ${cy} A ${rr} ${rr} 0 ${big} 1 ${x} ${y}" fill="none" stroke="${colour}" stroke-width="12"/>`+
    `<text x="${cx}" y="${cy-8}" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#000C53">${label}</text>`);
}
function stackRow(parts,w=620,h=26){
  const tot=parts.reduce((s,p)=>s+p[1],0)||1; let x=0,s='';
  parts.forEach(p=>{ const pw=p[1]/tot*w;
    s+=`<rect x="${x}" y="0" width="${pw}" height="${h}" fill="${p[2]}"/>`;
    if(pw>34) s+=`<text x="${x+pw/2}" y="${h*0.68}" text-anchor="middle" font-family="Calibri,sans-serif" font-size="11" fill="#fff" font-weight="bold">${esc(p[3]!==undefined?p[3]:p[1])}</text>`;
    x+=pw;});
  return svgWrap(w,h,s);
}
function heat(rows,cols,title){
  const cw=64, rh=21, lw=178, w=lw+cols.length*cw+8, h=rows.length*rh+30;
  let mx=1; rows.forEach(r=>r[1].forEach(v=>mx=Math.max(mx,v)));
  let s=`<g font-family="Calibri,sans-serif" font-size="11">`;
  cols.forEach((c,j)=>s+=`<text x="${lw+j*cw+cw/2}" y="14" text-anchor="middle" fill="#5b5f6b" font-weight="bold">${esc(c)}</text>`);
  rows.forEach((r,i)=>{
    const y=20+i*rh;
    s+=`<text x="${lw-7}" y="${y+rh*0.68}" text-anchor="end" fill="#5b5f6b">${esc(r[0])}</text>`;
    r[1].forEach((v,j)=>{
      const t=v/mx, col= v===0 ? '#fdeceb' : `rgba(0,12,83,${0.10+t*0.85})`;
      s+=`<rect x="${lw+j*cw}" y="${y}" width="${cw-2}" height="${rh-3}" fill="${col}"/>`;
      s+=`<text x="${lw+j*cw+(cw-2)/2}" y="${y+rh*0.68}" text-anchor="middle" font-weight="bold" fill="${v===0?'#8d2b22':(t>0.5?'#fff':'#1a1c22')}">${v}</text>`;
    });
  });
  return svgWrap(w,h,s+`</g>`);
}
function radar(items,size=210){
  const cx=size/2, cy=size/2, R=size/2-32, n=items.length;
  let poly='',axes='',labs='';
  items.forEach((it,i)=>{
    const a=-Math.PI/2 + i*2*Math.PI/n;
    const px=cx+R*Math.cos(a), py=cy+R*Math.sin(a);
    const vx=cx+R*clamp(it[1],0,1)*Math.cos(a), vy=cy+R*clamp(it[1],0,1)*Math.sin(a);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#E4E6EC"/>`;
    poly+=`${vx},${vy} `;
    const lx=cx+(R+16)*Math.cos(a), ly=cy+(R+16)*Math.sin(a);
    labs+=`<text x="${lx}" y="${ly+3}" text-anchor="middle" font-family="Calibri,sans-serif" font-size="10" fill="#5b5f6b">${esc(it[0])}</text>`;
  });
  let rings='';[0.25,0.5,0.75,1].forEach(f=>{
    let p='';items.forEach((it,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;p+=`${cx+R*f*Math.cos(a)},${cy+R*f*Math.sin(a)} `;});
    rings+=`<polygon points="${p}" fill="none" stroke="#E4E6EC"/>`;});
  return svgWrap(size,size,rings+axes+`<polygon points="${poly}" fill="rgba(0,12,83,.17)" stroke="#000C53" stroke-width="2"/>`+labs);
}

<h2>What the research supports, and what it does not <span class="tag res">researched</span></h2>
<div class="grid2">
<div class="box nav"><h4>Honest, in favour</h4><ul class="t">
<li><b>Belonging is well evidenced as an outcome in itself.</b> School belonging predicts attendance, achievement, graduation and mental-health functioning across the primary-to-secondary transition. Teacher support is the strongest single predictor &mdash; which means a house structure only works through the adults in it.</li>
<li><b>Structural reorganisation increases participation.</b> The largest study, across 119 funded high schools, found no significant achievement trend but did find increased extracurricular participation, higher promotion rates and fewer violent incidents.</li>
<li><b>Vertical grouping has consistent qualitative support.</b> UK vertical tutoring schools report reduced in-year cliques, older students modelling behaviour, and tutors able to attend to four Sec 1s rather than thirty.</li>
<li><b>Two Singapore precedents already run the recommended model.</b> Kranji allocates house with class at Sec 1; Hua Yi added a fifth house in 2020 specifically to integrate classes into houses.</li>

<div class="box nav"><h4>Honest, against</h4><ul class="t">
<li><b>There is no randomised evidence that house systems raise attainment.</b> Adopt this as a culture and participation structure or do not adopt it.</li>
<li><b>Enrichment effect sizes are softer than they look.</b> An umbrella review puts effects on academic achievement at 0.68, collapsing to 0.32 once corrected for publication bias, and the largest effects come from intensive residential formats, not weekly in-school bands.</li>
<li><b>Neither Renzulli nor Gagné appears in MOE guidance.</b> Singapore's language is school-based talent development and higher-ability learners. Citing these models internally is importing a framework, not aligning to national policy. Say so rather than let it be discovered.</li>
<li><b>Complex whole-school change needs at least two years.</b> EEF's named failure modes &mdash; initiative overload, the implementation dip, undefined active ingredients, over-reliance on individuals, neglected de-implementation &mdash; map uncomfortably well onto this proposal.</li>
<li><b>Teacher disengagement is the measured variance.</b> The one house-system dissertation found 25 percent staff disengagement producing performance disparities between houses.</li>
</ul></div>
</div>

<div class="verdict warn"><h3>The uncomfortable question worth putting to leadership first</h3>

<div class="box nav"><h4>The honest tension in the recommended model</h4>
<p>Class-anchored vertical is recommended because it is the only model where <b>every inter-class competition at a level is already an inter-house competition</b>. The house table fills from events the school already runs, which is why it is cheap. It also survives Full Subject Based Banding: under FSBB only six common-curriculum subjects hold a form class together, so a house keyed to form class is stable while a house keyed to banding would fragment.</p>
<p>The cost is real and should be said out loud: <b>house composition inherits class composition.</b> Mixing is weaker than random assignment would give &mdash; the model scores ${Math.round(ARCH.class.mix*100)} on social mixing against ${Math.round(ARCH.random.mix*100)} for random sorting. If a class arrives with a social problem, the house inherits it for four years.</p></div>

<div class="box"><h4>On Boon Lay, and why the CCA-anchored model deserves a hearing <span class="tag res">researched</span></h4>
<p>Boon Lay Secondary runs four houses &mdash; Garnet, Emerald, Morganite, Sapphire &mdash; each owning four CCAs, built on a CCA-centric model dating to 2017. It is a working Singapore instance of the architecture this dashboard scores lowest on nesting and daily reinforcement. That is worth taking seriously rather than dismissing: it means the objections below are theoretical unless someone checks how Boon Lay handles them.</p>
<p>The objections are that CCA rolls are uneven (Concert Band and NPCC roughly double Wushu and Football), that gender is structural rather than incidental (three boys-only CCAs against one girls-only), that CCAs thin at upper secondary so the vertical column narrows exactly where Sec 3 and 4 leaders should be, and that class nesting drops to zero. It is also, philosophically, the Hogwarts move: sorting by talent on arrival, against the developmental argument the rest of this design rests on.</p>
<p class="note">Recommended action: a call to Boon Lay before this goes to the SMC. One conversation would settle whether the four objections bite in practice, and it is the cheapest piece of evidence available to this project.</p></div>

<div class="thesis"><b>Why the existing names are enough.</b> Beatty's motto is Non Vi Sed Arte, not by force but by skill, and the school named its houses after five men whose profession was force. That reads as a contradiction until you look at what each is actually remembered for. Fisher for engineering. Jellicoe for judgement and restraint. Hood for going first. Sturdee for preparation. Harwood for reading a situation while outnumbered. Not one of the five is remembered for force. Each is remembered for a form of skill. The house system does not need new names; it needs the existing ones taken seriously. The complications are a feature: Jellicoe was sacked shabbily, and Beatty as First Sea Lord was involved in revising the official Jutland record at Jellicoe's expense. The school is named after the man who did that to the man one of its houses is named after. That is not a problem to manage. It is a History curriculum the school already owns.</div>`;

${S.houseOwns

 : `<p>Houses own belonging, vertical mentoring, the Wednesday exploration carousel, inter-house competition on the five DREAM domains, and the Total Talent Portfolio conversation with a tutor who follows a Beattyian for four or five years. Houses do <b>not</b> own the Thursday pathway rosters, Type III mentor allocation, or entry to any field. A Beattyian in any house can pursue any field.</p>
    <p class="note">The operational rule that keeps this true: <b>keep House Cup points to the Wednesday band, to sport and to performance.</b> The moment a house earns points for its members' olympiad results, the talent pool fragments into ${S.houses} and the whole structure inverts without anyone deciding to invert it.</p>`}
</div>

<div class="grid2">
<div><h3>Where the house genuinely adds what a pathway cannot</h3>
<p>Renzulli's four authenticity tests for a Type III are personal relevance, <b>no predetermined solution</b>, creation of new product or information, and an audience who <b>voluntarily attend</b>. The fourth is the one that fails most often in implementations worldwide, because a real external audience is genuinely hard to find for a fifteen-year-old's research project.</p>
<p>A house is a standing audience of ${Math.round(M.houseSize)} people who already know the presenter, already meet weekly, and already have a reason to care how it goes.</p>
<div class="metrics" style="margin-top:10px">
${metric(pct(M.presentShare),'Beattyians who present real work','Pursue plus a quarter of Build','')}
${metric(pct(M.witness),'Who watch a peer present',S.showcases?S.showcases+' showcase'+(S.showcases>1?'s':'')+' a year to the '+(S.showScope==='house'?'house':'whole school'):'No showcases scheduled',M.witness>.6?'ok':'warn')}
</div>
<p class="note">This is the mechanism behind "celebrate the talents of others". It is not a slogan; it is a scheduling decision about how many showcases run and who is in the room.</p></div>

<div><h3>The fidelity audits you can run yourself</h3>
<div class="box"><h4>The audience audit</h4>
<p>By week three of every cycle, what percentage of Pursue projects name a real external person or body who will voluntarily attend? Target 100 percent. This is the specific failure mode the published fidelity study found.</p></div>
<div class="box"><h4>The predetermined-solution test</h4>
<p>Ask every facilitator: do you already know what your students will produce? If yes, it is a mini-course, not a cluster, and you have renamed your extension classes.</p></div>
<div class="box"><h4>The dosage test</h4>
<p>Sessions per month per club. Currently <b>${r1(M.perMonth)}</b>. Below three, Gagné calls it busywork and you are running an exposure programme. Say which one you are running.</p></div></div>
</div>

<h2>Where the able Beattyians are currently being pulled apart <span class="tag mea">measured</span></h2>
<p class="lede">120 of 605 enrichment occurrences carry selection language, drawn from just 26 programmes. Selective programmes competing for the same level in the same term average 2.3 and peak at 6.</p>
<div class="box" style="border-left:4px solid var(--red)">
<p><b>Sec 3, Term 1 of 2024 had six selective programmes live at once:</b> Creative Writing Programme, EL Debate Workshop, Model UN Programme, Peer Support Leader Programme, SIMC 2.0 Learning Festival, Sports Leaders Selection.</p>
<p><b>Sec 2, Term 2 of 2024 had five:</b> Creative Writing, Geographical Investigation, Literature Play, NCC, SMO Training.</p>
<p class="note">The Beattyian selected for SMO is very likely the Beattyian selected for MUN, for Tech Champs, for Tier Three leadership. Nothing in the calendar suggests anyone was reconciling those claims &mdash; and nobody currently owns the job of doing so. The house tutor is the obvious candidate and the Total Talent Portfolio the obvious instrument.</p></div>

<div class="box nav"><h4>The load-management instrument: make substitutable activities collide on purpose</h4>
<p><b>Substitutable activities collide. Complementary activities separate.</b> Two clubs recruiting the same profile run at the same hour, so a Beattyian must choose one. Two clubs developing different capacities run in different blocks, so a Beattyian can hold both.</p>
<p>Set A, analytical pursuit &mdash; Mathematics Olympiad Guild, Science Olympiad Guild, NEXUS Applied STEM Studio, Data and AI Craft. Set B, discursive pursuit &mdash; Model UN Delegation, Debate and Oracy Society, Policy and Enterprise Forum. <b>A and B run against each other deliberately.</b> A Beattyian doing SMO cannot also do MUN in the same cycle; across ${S.cycles} cycles they can do both, sequentially, with proper depth in each. That is the point, not a side effect.</p>
<p class="note">Ceiling: one Wednesday house commitment, at most one Thursday pathway commitment, plus CCA on its own days. Maximum two concurrent enrichment commitments, enforced through the timetable rather than through exhortation, which is why it will hold.</p></div>`;
}

<p>There is exactly one way this arithmetic closes, and it is the thing most schools refuse to do: <b>Renzulli's model does not require content expertise from facilitators.</b> His enrichment clusters are facilitated rather than taught, and the published recruitment call goes to teachers, support staff, parents and community members alike. A parent who restores motorcycles can run a cluster. An admin officer who keeps bees can run a cluster. If facilitation stays inside the teaching establishment, the numbers do not close at any realistic staffing level.</p>

<tr><td><b>Assistant Head</b></td><td class="n">1</td><td>Wednesday cluster logistics and the house exco. The succession line.</td></tr>
<tr><td><b>House Tutors</b></td><td class="n">${S.tutors}</td><td>A vertical tutor group each, ${Math.round(M.tutorRatio)} Beattyians spanning Sec 1 to ${S.levels}. Owns the Total Talent Portfolio conversation and follows the same students for ${S.levels} years.</td></tr>
<tr><td><b>Cluster facilitators</b></td><td class="n">${Math.round(M.clustersNeeded/S.houses)}</td><td>One Wednesday cluster each. Drawn from the whole adult community, not only teachers.</td></tr>
<tr><td><b>Pathway mentors</b></td><td class="n">${Math.round(M.mentorsNeeded/S.houses)}</td><td>Cross-house, attached to Type III projects, not to houses. Deliberately outside the house line.</td></tr>
</tbody></table></div>
<p class="note">Note the last row. Pathway mentors report to the field, not the house. That is the structural expression of the rule that houses own belonging and fields own pursuit &mdash; if mentors sat inside houses, the talent pool would fragment through the staffing chart even if the policy said otherwise.</p></div>
</div>

<h2>Vertical tutoring, and what makes it fail <span class="tag res">researched</span></h2>
<div class="grid2">
<div class="box nav"><h4>What it buys</h4><ul class="t">
<li>Reduced in-year rivalry and cliques; students make friends across year groups.</li>
<li>Older students behave more maturely because they feel a duty to model it.</li>
<li>A tutor can attend to four Sec 1s in September rather than thirty &mdash; the single most cited practical advantage.</li>
<li>No hierarchy by year, so belonging does not depend on seniority.</li>
</ul></div>
<div class="box" style="border-left:4px solid var(--red)"><h4>What makes it fail</h4><ul class="t">
<li>Schools assume vertical tutoring is "just mixing up the kids and staff". It is not. It needs training and an explicit rationale or it becomes a differently shaped registration period.</li>
<li>The one house-system dissertation found <b>25 percent teacher disengagement directly producing performance disparities between houses.</b> A house with a disengaged Head is not a neutral outcome; it is a visibly losing house full of students who notice.</li>
<li>Vertical tutoring needs regular short sessions to work. If the only house contact is the Wednesday band, the tutoring relationship is ${Math.round(M.actualDays)} days a year and the "tutor who follows you for ${S.levels} years" is largely notional.</li>
</ul></div>
</div>

<div class="box"><h4>The de-implementation question, which EEF says you must answer</h4>
<p>EEF is explicit that complex whole-school initiatives fail when nothing is stopped. <b>${AUD.prog1or2} of ${AUD.programmes} programmes ran once or twice across two years.</b> They are the obvious candidates, and retiring them is also the fastest way to free adults &mdash; every one-off programme consumed planning time from someone who could instead run a ten-session cluster.</p>
<p class="note">Ask each department which of its programmes it wants to <i>convert</i>, <i>rebuild</i> or <i>retire</i>. Publishing the 1.33 figure and the ten empty coverage cells is what makes that conversation possible, and it is a Term 4 job that costs nothing.</p></div>`;
}

${metric(M.talent,'Talent depth index','Dosage, pool, pursuit, mentoring',M.talent>=60?'ok':'warn')}
${metric(pct(M.witness),'Celebration reach','Who watches a peer present real work',M.witness>.6?'ok':'warn')}
${metric(M.supplyGapWed>0?'−'+M.supplyGapWed:'0','Adult shortfall on Wednesday',M.supplyGapWed>0?'The binding constraint':'Supply closes',M.supplyGapWed>0?'bad':'ok')}
${metric(M.ok?'Holds':'Fails','Does this configuration hold?',M.issues.length+' finding'+(M.issues.length>1?'s':''),M.ok?'ok':'bad')}
</div>

<div class="box nav"><h4>How the affinity index is built <span class="tag mod">modelled</span></h4>
<div class="chart">${hbar(M.affParts.map(p=>[p[0],p[1]*100,p[1]>.66?'#1a7f4b':(p[1]>.33?'#b8860b':'#c0392b'),Math.round(p[1]*100)]),{w:560,lw:238,rh:21,max:100})}</div>
<p class="note">This is an illustrative composite, not a measurement, and it should never be quoted as one. It exists so the trade-offs between contact time, tutor ratio, persistence and event density are visible in one place rather than argued separately. Weights: contact 25, persistence 20, vertical span 15, tutor ratio 15, daily reinforcement 15, event density 10.</p></div>

${D.map((d,i)=>`<div class="dec"><h4>${i+1}. ${d[0]}</h4><div class="q">${d[1]}</div>
  <div class="cons"><b>At current settings:</b> ${d[2]}</div></div>`).join('')}

${cmp}

<h2>A sequence, if the answer is yes</h2>
<div class="scroll"><table><thead><tr><th>When</th><th>EEF stage</th><th>What happens</th><th>The number that tells you it worked</th></tr></thead><tbody>
<tr><td><b>Term 4, this year</b></td><td>Explore</td><td>Publish the audit. Let departments see the 1.33 figure and the ten empty coverage cells. Ask each which programmes to convert, rebuild or retire. Name the houses with students.</td><td>Departments returning a convert/rebuild/retire decision for every programme they own.</td></tr>
<tr><td><b>Term 1, next year</b></td><td>Prepare and pilot</td><td>One cycle of the Wednesday house band only, with the convert-now clubs, Sec 1 to 3. Do not touch Thursday. Do not touch Sec 4 and 5.</td><td>Fill rate: percentage getting first or second choice. Below 80 percent means the catalogue is too narrow.</td></tr>
<tr><td><b>Terms 2 and 3</b></td><td>Deliver</td><td>Add the Thursday pathway band and a first Pursue cohort of about 60, not 150. Attach a named mentor to each Type III.</td><td>By week three of each cycle, percentage of Type III projects naming a real external audience. Target 100.</td></tr>
<tr><td><b>Year two</b></td><td>Sustain and extend</td><td>Add Sec 4. Rebuild the thin clubs. Introduce the Cup on the five DREAM domains with per-capita scoring and a termly reset.</td><td>Sessions per month per club, against the Gagné line of 3.</td></tr>
</tbody></table></div>

<h2>What breaks this</h2>
<ul class="t">
<li><b>Oral examinations reclaim the band.</b> Forty-one entries over two years say they will. Publish the oral windows before cycles are set and shorten Cycle 2 around them.</li>
<li><b>Facilitator supply fails and the model shrinks back to 1.33 options.</b> The most likely single failure, and the one this dashboard is most insistent about.</li>
<li><b>Type III becomes Type II in disguise.</b> The commonest failure of enrichment-model implementations worldwide. If Thursday becomes teacher-directed advanced content, the construct has collapsed and you have renamed your extension classes.</li>
<li><b>Houses colonise pathways.</b> The moment a house earns points for members' olympiad results, the talent pool fragments into ${S.houses}.</li>
<li><b>The invisible curriculum stays invisible.</b> Ten empty coverage cells may reflect recording failure rather than provision failure. Fixing recording discipline is a precondition, not an afterthought.</li>
<li><b>Sec 4 and 5 get written off.</b> The data shows this already happening. A vertical house that stops at Sec 3 is not vertical.</li>
</ul>

<div class="box" style="border-left:4px solid var(--yellow)"><h4>Four numbers would replace most of this modelling</h4>
<ol style="margin:.3em 0 0;padding-left:20px;font-size:.92em">
<li><b>Form classes per level.</b> Decides whether five houses nest cleanly. It resolves itself at Sec 1 registration whether or not it is modelled first.</li>
<li><b>CCA roll by CCA</b>, split by level and gender. Replaces the whole modelled layer.</li>
<li><b>Facilitator supply per band day.</b> Determines whether the choice architecture is real or nominal.</li>
<li><b>House colours for Harwood, Sturdee and Fisher.</b> Not published anywhere reachable; the NLB commemorative histories are the likely record.</li>
</ol></div>`;
}

  syncRail();
  $$('#main input[data-a]').forEach(cb=>cb.onchange=()=>{S.acts[cb.dataset.a]=cb.checked?1:0;render();});
  window.scrollTo({top:0});
}
function footer(){
  return `<footer class="bty"><div class="band">
   <b>Beatty Secondary School</b>
   <i>Non Vi Sed Arte &mdash; not by force but by skill</i>
   <span>Every Beattyian A Purpose Driven Steward</span></div>

   <span class="tag mod">modelled</span> is an adjustable control on this page and is never a measurement.
   <span class="tag res">researched</span> is from published sources outside Beatty.
   <span class="tag unk">unverified</span> is not published anywhere reachable.
   Composite indices are illustrative and exist to make trade-offs visible; they are not fit to quote.</div></footer>`;
}

$$('.gnav a[data-t]').forEach(a=>a.onclick=()=>{S.tab=a.dataset.t;render();});
