<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" id="themeColor" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E21CC Log v3">

<title>E21CC Log v3 · Beatty Secondary School</title>

<meta name="description" content="The E21CC Log for Beattyians: GROW and ACT journals, Beatty’s I can statements, and a level for each of MOE’s 21st Century Competencies.">
<style>
@font-face{font-family:'Literata';src:url(assets/fonts/literata-var-latin.woff2) format('woff2');font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(assets/fonts/inter-regular-latin.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(assets/fonts/inter-semibold-latin.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(assets/fonts/inter-bold-latin.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(assets/fonts/inter-extrabold-latin.woff2) format('woff2');font-weight:800;font-style:normal;font-display:swap}
/* ------------------------------------------------------------------
   The E21CC Log in four views, one set of markup. body[data-look]:
   a  Case and notebooks: a cloth case, lined paper, ribbon tabs.
   b  Clean record (the default): light surfaces, Beatty navy and yellow.
   c  Editorial: off white, serif type, rules instead of boxes.
   d  Bright and friendly: warm, rounded, big buttons.
   Each view has a light and a dark theme (body[data-theme]) and takes
   the student's colour (body[data-colour]). Components use tokens only.
   ------------------------------------------------------------------ */
:root{
  --navy:#000C53; --yellow:#FFE200; --red:#EC3237; --act:#c4262c; --g4:#C9CBD8;
  --brand:#0b1b5c; --brand-2:#2a4bd1; --brand-2-ink:#ffffff; --btn-bg:var(--brand); --btn-ink:#ffffff;
  --accent:#FFE200; --accent-ink:#0b1b5c;
  --bg:#f4f5f9; --bg-img:none; --on-bg:#111633; --on-bg-2:#4a5068;
  --surface:#ffffff; --surface-2:#f4f6fd; --surface-3:#e8eaf2; --paper:#ffffff;
  --text:#111633; --text-2:#4a5068; --head:var(--brand); --kick:#4a5068; --link:var(--brand-2);
  --line:#e6e8f0; --line-2:#cfd4e3;
  --top-bg:#ffffff; --top-ink:var(--brand); --top-sub:#4a5068; --top-line:#e6e8f0;
  --side-bg:#ffffff; --side-line:#e6e8f0;
  --nav-bg:#ffffff; --nav-ink:#4a5068; --nav-on-bg:var(--accent); --nav-on-ink:#0b1b5c; --nav-on-text:var(--brand);
  --hero-bg:var(--brand); --hero-ink:#ffffff; --hero-ink-2:rgba(255,255,255,.88);
  --meter:#e2e5ee; --meter-on:var(--brand-2); --legend:#1f3fa8;
  --ok:#1d7343; --ok-ink:#ffffff; --info-bg:#e8edff; --info-ink:#1f3fa8; --danger:#b3141a; --note:#b3141a;
  --focus:#1f3fa8; --wheel-bg:#ffffff;
  --radius:14px; --radius-s:10px; --btn-radius:12px; --chip-radius:999px;
  --shadow-card:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.09); --card-border:1px solid transparent;
  --shadow:0 12px 30px rgba(16,24,40,.2);
  --fs:16px; --lh:1.55;
  --sans:Inter,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --serif:Literata,Georgia,"Times New Roman","Noto Serif",serif;
  --head-font:var(--sans); --head-weight:800; --body-font:var(--sans); --quote-font:var(--serif);
}
/* the student's colour */
body[data-colour="forest"]{--brand:#1d4a37;--brand-2:#23704b}
body[data-colour="plum"]{--brand:#4a2a5c;--brand-2:#74419a}
body[data-colour="crimson"]{--brand:#861c27;--brand-2:#b02d3b}
body[data-colour="teal"]{--brand:#0e5461;--brand-2:#14707f}
body[data-colour="ochre"]{--brand:#6b4d0c;--brand-2:#8a6210}
/* on a dark page the second tone of each colour is a light one, with dark text on it */
body[data-theme="dark"]{--brand-2:#9fb4ff;--brand-2-ink:#0f1220}
body[data-theme="dark"][data-colour="forest"]{--brand-2:#7fd6a8}
body[data-theme="dark"][data-colour="plum"]{--brand-2:#d2a8f0}
body[data-theme="dark"][data-colour="crimson"]{--brand-2:#ff9aa5}
body[data-theme="dark"][data-colour="teal"]{--brand-2:#7fd8e6}
body[data-theme="dark"][data-colour="ochre"]{--brand-2:#f0c060}
body[data-accent="coral"]{--accent:#FF7A6B;--accent-ink:#3a0d08}
body[data-accent="mint"]{--accent:#5FD3A8;--accent-ink:#053a27}
body[data-accent="sky"]{--accent:#7CC0FF;--accent-ink:#082a4d}
body[data-accent="lilac"]{--accent:#C4ACFF;--accent-ink:#2b1560}
body[data-size="large"]{--fs:18px}
body[data-size="xl"]{--fs:20px}
/* dark: the same view, at night */
body[data-theme="dark"]{
  --bg:#0f1220; --on-bg:#e9ecf8; --on-bg-2:#b4bad6;
  --surface:#181c2e; --surface-2:#1f2438; --surface-3:#2a3048; --paper:#181c2e;
  --text:#e9ecf8; --text-2:#b4bad6; --head:#ffffff; --kick:#c3c9e6; --link:#9fb4ff;
  --line:#2a3048; --line-2:#3c4566;
  --top-bg:#141829; --top-ink:#ffffff; --top-sub:#b4bad6; --top-line:#2a3048; --side-bg:#141829; --side-line:#2a3048;
  --nav-bg:#141829; --nav-ink:#b4bad6; --nav-on-text:#ffffff;
  --btn-bg:var(--accent); --btn-ink:var(--accent-ink);
  --hero-bg:#1f2438; --hero-ink:#ffffff; --hero-ink-2:#c3c9e6;
  --meter:#2a3048; --meter-on:#8ea2ff; --legend:#8ea2ff;
  --ok:#2f9e63; --info-bg:#24305e; --info-ink:#c9d4ff; --danger:#ff8a8d; --note:#ff9a9d;
  --focus:#FFE200; --wheel-bg:#181c2e;
  --shadow-card:0 1px 2px rgba(0,0,0,.3); --shadow:0 12px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body-font);font-size:var(--fs);line-height:var(--lh);color:var(--text);min-height:100vh;min-height:100dvh;overflow-wrap:break-word;color-scheme:light;background-color:var(--bg);background-image:var(--bg-img)}
a,button,.chip,.tile{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3,h4{font-family:var(--head-font);font-weight:var(--head-weight);color:var(--head);margin:0 0 .35em;line-height:1.2;letter-spacing:-.005em}
h1{font-size:1.55em} h2{font-size:1.18em} h3{font-size:1.04em}
p{margin:0 0 .8em}
a{color:inherit}
p a,small a,li>a,.tiny a,.meta a{color:var(--link)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
textarea{resize:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:12px;top:-60px;z-index:60;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- the frame: top bar, places, page ---------- */
.app{position:relative;max-width:900px;margin:0 auto;padding:0 16px 28px}
body.composing #app{display:none}
.topbar{display:flex;align-items:center;gap:10px;margin:0 -16px 14px;padding:10px 16px;background:var(--top-bg);border-bottom:1px solid var(--top-line);color:var(--top-ink)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1;min-height:44px;text-decoration:none;color:inherit}
.brand .bt{min-width:0;line-height:1.2}
.brand .word{display:block;font-family:var(--head-font);font-weight:var(--head-weight);font-size:1.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{display:block;font-size:.84em;color:var(--top-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--brand);color:var(--accent);display:grid;place-items:center;padding:0;text-decoration:none;border:0}
.avatar svg{width:22px;height:22px}
body[data-theme="dark"] .avatar{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px;margin:0 0 16px}
.tab{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 10px;border-radius:12px;color:var(--nav-ink);text-decoration:none;font-weight:700;font-size:.95em;white-space:nowrap}
.tab .ti{display:grid;place-items:center}
.tab svg{width:20px;height:20px}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--nav-on-bg);color:var(--nav-on-ink)}
.navnew{display:none}
.page{position:relative;min-height:50vh}
.footer{color:var(--on-bg-2);font-size:.85em;text-align:center;padding:18px 0 6px}
.footer b{font-family:var(--head-font)}

/* ---------- page content ---------- */
.hero{padding:2px 0 12px}
.hero h1{margin-bottom:.2em}
.meta{color:var(--text-2);font-size:.95em}
.motto{font-family:var(--quote-font);font-style:italic;border-left:3px solid var(--accent);padding-left:10px;margin:.4em 0}
.kicker{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--kick);margin:0 0 4px;font-weight:700}
.kicker a{color:inherit;display:inline-flex;align-items:center;min-height:44px;margin:-12px 0}
.crumb{margin:-6px 0 4px}
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);text-decoration:none;font-weight:700;font-size:.92em;min-height:44px}
.backlink svg{width:16px;height:16px}
.card{background:var(--surface);border:var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:16px;margin:0 0 14px}
.card.flat{background:transparent;box-shadow:none;border:1.5px dashed var(--line-2)}
.card h2{margin-top:0}
.tiny{font-size:.86em;color:var(--text-2);overflow-wrap:anywhere}
.muted{color:var(--text-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.flabel{display:block;font-weight:700;margin-bottom:6px;color:var(--head)}
.two{display:grid;gap:0 14px;grid-template-columns:1fr}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.notice{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 var(--radius-s) var(--radius-s) 0;margin:10px 0;color:var(--text)}
.notice.warn{border-color:var(--red)}
.subpanel{border:1px dashed var(--line-2);border-radius:var(--radius-s);padding:12px;margin-top:10px;background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;font-family:var(--sans);font-weight:800;font-size:max(12px,.74em);letter-spacing:.06em;padding:3px 8px;border-radius:6px;line-height:1.3;white-space:nowrap}
.b-grow{background:var(--navy);color:#fff} .b-act{background:var(--act);color:#fff} .b-across{background:var(--yellow);color:var(--navy)}
body[data-theme="dark"] .b-grow{background:#3d4fb0}
.tag{display:inline-block;background:var(--surface-3);border-radius:999px;padding:2px 10px;font-size:.84em;font-weight:600;color:var(--head);margin:2px 4px 2px 0}

/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--btn-radius);border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-ink);padding:10px 18px;font-weight:700;min-height:44px;text-decoration:none;transition:transform .08s;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface);color:var(--head);border-color:var(--line-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--head);padding-left:10px;padding-right:10px}
.btn.danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn.ghost.danger{background:transparent;border-color:transparent}
.btn.small{padding:6px 14px;font-size:.92em}
.btn.wide{width:100%}
.btn.big{min-height:52px;font-size:1.02em}
.btn.big small{display:block;font-size:.76em;font-weight:600;opacity:.9}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--head);display:grid;place-items:center;padding:0}
label.f,div.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:700;margin-bottom:6px;color:var(--head)}
label.f small,.f small.help{display:block;font-weight:400;color:var(--text-2);margin-top:4px;font-size:.86em}
.in{width:100%;border:2px solid var(--line-2);border-radius:var(--radius-s);padding:10px 12px;background:var(--surface);min-height:46px}
.in:focus{border-color:var(--focus);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
.in::placeholder{color:#767a8c}
body[data-theme="dark"] .in::placeholder{color:#9aa1c0}
textarea.in{min-height:96px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--chip-radius);padding:7px 14px;min-height:44px;color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip svg{width:17px;height:17px}
.chip.on{border-color:var(--btn-bg);background:var(--btn-bg);color:var(--btn-ink)}
.chip small{font-weight:400;opacity:.85}
.chip em{font-style:normal;font-size:.75em;font-weight:800;letter-spacing:.05em;color:var(--kick)}
.chip.on em{color:inherit}
.dchip{border-color:color-mix(in srgb,var(--d) 55%,transparent);border-left:6px solid var(--d)}
.seg{display:inline-flex;gap:2px;background:var(--surface-3);border-radius:12px;padding:3px;max-width:100%}
.seg.wrap{flex-wrap:wrap}
.seg button,.seg a{border:0;background:transparent;border-radius:9px;padding:8px 12px;min-height:44px;min-width:44px;color:var(--text-2);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:.92em}
.seg button.on,.seg a.on{background:var(--surface);color:var(--head);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.seg.icons svg{width:20px;height:20px}
.pick-row{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;cursor:pointer;background:var(--surface);min-height:48px}
.pick-row input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--brand)}
.pick-row b{display:block;color:var(--head)} .pick-row small{display:block;color:var(--text-2)}
.pick-row:has(input:checked){border-color:var(--brand-2);background:var(--surface-2)}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-height:44px;padding:10px 0}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--brand)}
.linkbtn{border:0;background:transparent;color:var(--link);font-size:.88em;font-weight:600;text-decoration:underline;padding:0 4px;min-height:44px;min-width:44px}
details{border:1px solid var(--line);border-radius:var(--radius-s);padding:0 12px;margin-bottom:10px;background:var(--surface)}
details[open]{padding-bottom:10px}
summary{cursor:pointer;font-weight:700;color:var(--head);padding:10px 0;min-height:44px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--surface-3);padding:1px 5px;border-radius:4px}

/* ---------- the wheel, levels and statements ---------- */
.wheelcard h1{font-size:1.4em}
.wheelwrap{max-width:340px;margin:6px auto 4px}
.wheel{width:100%;height:auto;display:block;overflow:visible}
.wheel .segbg{fill:var(--wheel-bg)}
.wheel .hatchbg{fill:var(--wheel-bg)}
.wheel .segline{fill:none;stroke-width:1.2;stroke-opacity:.75}
.wheel .seg text{fill:var(--text);font-family:var(--sans);font-weight:700;pointer-events:none}
.wheel .seg text.on{fill:#fff}
.wheel .seg:hover .segline,.wheel .seg:focus-visible .segline{stroke-width:3.5;stroke-opacity:1}
.wheel .seg:focus{outline:none}
.wheel .core{fill:var(--brand);stroke:var(--wheel-bg);stroke-width:3}
.wheel .corelabel{fill:#fff;font-family:var(--serif);font-weight:700}
body[data-theme="dark"] .wheel .core{fill:#2a3a8f}
.wheel .star{fill:var(--yellow);stroke:#000C53;stroke-width:1.4}
.istar{width:15px;height:15px;vertical-align:-2px;fill:var(--yellow);stroke:#000C53;stroke-width:1.6}
.wlegend,.dlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:.84em;color:var(--text-2);margin-top:6px}
.wlegend i,.dlegend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--legend)}
.wlegend i.hatch{background:repeating-linear-gradient(45deg,#c98a00 0 2px,transparent 2px 5px);border:1px dashed #c98a00;opacity:1!important}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.acts .btn{width:100%}
.meter{display:inline-flex;gap:4px;width:76px;flex:none}
.meter i{flex:1;height:8px;border-radius:4px;background:var(--meter)}
.meter i.on{background:var(--meter-on)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--d);flex:none}
.lvlist{list-style:none;margin:4px 0 0;padding:0}
.lvlist li+li{border-top:1px solid var(--line)}
.lvlist a{display:grid;grid-template-columns:10px minmax(0,1fr) auto;grid-template-areas:"d n w" "d m w";align-items:center;column-gap:10px;row-gap:4px;min-height:48px;padding:8px 0;text-decoration:none;color:var(--text)}
.lvlist .cdot{grid-area:d;align-self:start;margin-top:6px}
.lvlist .ln{grid-area:n;min-width:0}
.lvlist .meter{grid-area:m}
.lvlist.big .meter{width:120px}
.lvlist .ln b{display:block;font-weight:600;color:var(--head);line-height:1.25}
.lvlist .ln small{display:block;color:var(--text-2);font-size:.84em}
.lvlist .lw{grid-area:w;font-size:.88em;color:var(--text-2);text-align:right;line-height:1.25;max-width:9em}
.lvlist a:hover .ln b{text-decoration:underline}
.slist,.blist{list-style:none;margin:4px 0 0;padding:0}
.slist li,.blist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.slist li:first-child,.blist li:first-child{border-top:0;padding-top:4px}
.slist .cdot{margin-top:8px}
.stt{margin:0;line-height:1.4}
.stt a{color:var(--text);text-decoration:none;font-weight:600}
.stt a:hover{text-decoration:underline}
.slist small,.blist small{display:block;color:var(--text-2);font-size:.86em;margin-top:2px}
.slist small.miss b{color:var(--head)}
.next{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:44px}
.next input{width:24px;height:24px;flex:0 0 24px;margin-top:2px;accent-color:var(--brand)}
.next p{margin:0;font-family:var(--quote-font);font-size:1.05em}
.aimline{display:flex;gap:8px;align-items:flex-start;font-size:.92em;color:var(--text-2);margin:10px 0 0}
.aimline svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--brand-2)}
.showcase{opacity:.92}
.latest{display:block;text-decoration:none;color:var(--text)}
.latest q,.evid q,.st .ev q,.st .sugg q{display:block;font-family:var(--quote-font);font-style:italic;margin:4px 0;color:var(--text);quotes:"“" "”"}
.notecard{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--text);border-left:5px solid var(--red)}
.notecard svg{width:28px;height:28px;color:var(--note);flex:0 0 28px}
.notecard b{display:block;color:var(--head)}
.notecard small{color:var(--text-2)}
/* Home: Where am I now? and What next? */
.wheelcard{container-type:inline-size}
.nowgrid{display:grid;gap:10px}
/* the panel sits beside the wheel whenever the card is wide enough: a tablet, or a wide laptop */
@container (min-width:600px){
  .nowgrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:18px}
  .cpanel{border-top:0;border-left:1px solid var(--line);padding:4px 0 4px 18px}
}
.cpanel{border-top:1px solid var(--line);padding-top:10px}

.helpbox .ask{margin:0 0 6px;border:0;padding:0}
.helpbox .row{margin-top:6px}
.frame,.model{margin:8px 0 0;font-family:var(--quote-font);color:var(--text)}
.frame .kick,.model .kick{margin-bottom:2px}
p.frame{background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:6px 10px}
.ftbox{margin:0 0 14px;padding:12px;border-radius:var(--radius-s);background:var(--surface-2);border:1px solid var(--line)}
.ftbox .plan{margin:2px 0 4px;font-family:var(--quote-font);font-size:1.05em;color:var(--head)}
.ftbox .seg{margin-top:8px}
.ftcount{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-weight:700;color:var(--ok);font-size:.92em}
.ftcount svg{width:16px;height:16px}
/* the (i) beside each question */
.qhead{position:relative;display:flex;align-items:flex-start;gap:6px}
.qhead .qlabel{flex:1;min-width:0}
.qinfo{flex:none;width:44px;height:44px;margin:-10px -8px -6px 0;border:0;background:transparent;color:var(--brand-2);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.qinfo svg{width:22px;height:22px}
.qinfo:hover,.qinfo.on{background:var(--surface-2)}
.qpop{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:-2px;padding:12px 14px;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--line-2);border-left:4px solid var(--accent);box-shadow:var(--shadow);font-weight:400;font-size:.95em}
.qpop[hidden]{display:none}
.qpop .qpa{margin:0 0 8px;color:var(--head);font-weight:600}
.qpop ul{margin:2px 0 8px;padding-left:18px}
.qpop li{margin:2px 0}
.qpop .qpex{list-style:none;padding:0}
.qpop .qpex li{padding:5px 0;border-top:1px solid var(--line);font-family:var(--quote-font)}
.qpop .qpex li:first-child{border-top:0}
.qpop .qpex b{font-family:var(--sans);display:block;font-size:.84em;color:var(--text-2)}
.qpop .tiny{margin:4px 0 0}
/* the aim: a competency first, then its statements */
.aimpick{display:grid;gap:8px;margin-top:4px}
.aimpick .f{margin:0}
.aimpick select{width:100%}
/* what the words show: knowledge, skills, values and dispositions */
.kslist{list-style:none;margin:4px 0 0;padding:0}
.kslist li{padding:7px 0;border-top:1px solid var(--line)}
.kslist li:first-child{border-top:0;padding-top:2px}
.kslist b{color:var(--head)}
.kslist small{color:var(--text-2)}
.kslist q{display:block;font-family:var(--quote-font);font-style:italic;color:var(--text);margin-top:2px;quotes:"“" "”"}
.kplain{display:block;font-size:.88em;color:var(--text-2)}
.ktag{display:inline-block;font:800 max(12px,.72em) var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--head);vertical-align:1px}
.ktag.t-k{background:var(--info-bg);color:var(--info-ink)} .ktag.t-s{background:var(--brand-2);color:var(--brand-2-ink)} .ktag.t-v{background:var(--accent);color:var(--accent-ink)}
.coach.nothing p{margin:0;color:var(--text-2)}
/* subject levels */
.slevels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slv{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92em;color:var(--text)}
.slv .in{min-height:44px;padding:6px 8px}
.q .hint{display:block;font-size:.88em;color:var(--text-2);margin-top:6px}
.dock{position:sticky;bottom:0;z-index:2;background:linear-gradient(transparent,var(--bg) 30%)}
.dock .dinner{display:flex;gap:10px;align-items:center;padding:14px 2px calc(16px + env(safe-area-inset-bottom))}
.dock .btn{min-height:48px;padding-left:22px;padding-right:22px}
.dock .btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--head)}
.dock .go{margin-left:auto}
.ring{width:120px;height:120px;margin:0 auto 10px;display:block}
@media (max-height:700px){.ring{width:90px;height:90px}.stephead h1{font-size:1.2em}.medal{width:44px;height:44px;flex-basis:44px;font-size:1.25em}}
.resume .row{margin-top:12px}
.mini{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--kick);font-weight:700;margin:16px 0 8px;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;padding:8px 4px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--text);font-weight:600;font-size:.9em;text-align:center;line-height:1.2}
.tile svg{width:24px;height:24px;color:var(--head)}
.tile.on{border-color:var(--brand-2);box-shadow:inset 0 0 0 1.5px var(--brand-2);background:var(--surface-2);color:var(--head)}
.typepanel{margin-top:10px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line-2)}
.typepanel .mini{margin-top:0}
.addhint{display:flex;align-items:center;gap:6px;font-size:.88em;color:var(--text-2);margin:8px 0 0}
.addhint svg{width:16px;height:16px;color:var(--ok)}
#addOther select{flex:1 1 130px} #addOther input{flex:2 1 160px} #addSubj input{flex:1 1 180px}
.grpline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9em;color:var(--text-2);margin:6px 0 0}
.aim{margin-top:6px;padding-top:12px;border-top:1px dashed var(--line-2)}
.aim select{font-size:.95em}
.guide{display:none}

/* reading back: answers, coach, competency read, notes */
.banner{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin:0 0 14px}
.banner b{font-family:var(--head-font);font-size:1.12em;color:var(--head)}
.banner p{margin:2px 0 0;color:var(--text-2)}
.readback{max-width:74ch}
.readback .qa{margin-bottom:12px}
.readback .qa b{display:block;font-family:var(--head-font);font-weight:700;color:var(--head);font-size:.96em}
.readback .qa p{margin:2px 0 0;white-space:pre-wrap}
.readback .qa p.empty{color:var(--text-2);font-style:italic}
.coach{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--surface-2)}
.coach .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.coach .who .avatar{width:36px;height:36px;flex-basis:36px}
.coach .who .avatar svg{width:19px;height:19px}
.coach .who b{color:var(--head)} .coach .who small{color:var(--text-2);display:block}
.coach .part{margin-bottom:10px}
.coach .part>b,.kick{display:block;font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--kick);margin-bottom:3px;font-weight:700}
.coach .part p{margin:0}
.ask{border-left:3px solid var(--accent);padding-left:10px;font-family:var(--quote-font);font-size:1.04em;margin:4px 0 0}
.depth{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:.92em;flex-wrap:wrap}
.depth i{width:12px;height:12px;border-radius:50%;background:var(--line-2);display:inline-block}
.depth i.on{background:var(--brand-2)}
.depth b{color:var(--head);white-space:nowrap}
.stance{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.stance .track{display:flex;gap:4px;flex:0 0 auto}
.stance .track i{width:22px;height:10px;border-radius:5px;background:var(--line-2)}
.stance .track i.on{background:var(--brand-2)}
.stance b{color:var(--head)}
.evid{list-style:none;margin:0;padding:0}
.evid li{border-top:1px solid var(--line);padding:10px 0}
.evid li:first-child{border-top:0;padding-top:0}
.evid b{color:var(--head)}
.evid a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}
.evid a b{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.evid small{display:block;color:var(--text-2)}
.evid .btn{margin-top:6px}
.str{font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--head);white-space:nowrap}
.str.clear{background:var(--brand-2);color:var(--brand-2-ink)}
.str.strong{background:var(--accent);color:var(--accent-ink)}
.str.none{background:transparent;border:1px solid var(--line-2);color:var(--text-2)}
.st-quote{font-family:var(--quote-font);font-style:italic;border-left:3px solid var(--accent);padding-left:10px;color:var(--head)}
.qa-row .notes{margin:0 0 12px}
.mnote{border-left:3px solid var(--red);background:var(--surface-2);padding:8px 12px;margin:6px 0 10px 6px;border-radius:0 var(--radius-s) var(--radius-s) 0}
.mnote .by{display:block;font-size:.78em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin-bottom:2px}
.mnote p{margin:0;font-family:var(--quote-font);font-style:italic;color:var(--note);white-space:pre-wrap}
.mnote.unread{box-shadow:inset 0 0 0 2px rgba(236,50,55,.25)}
.notes details.older{border:0;padding:0;margin:0 0 4px 6px;background:transparent}
.notes details.older summary{font-size:.86em;color:var(--text-2);font-weight:600}
@media (min-width:1280px){.qa-row.has-note{display:grid;grid-template-columns:minmax(0,1fr) 240px;column-gap:20px;align-items:start}.qa-row.has-note .notes{margin:0}.qa-row.has-note .mnote{margin:0 0 8px}}

/* dialogs and toasts */
.inline-dlg{border:2px solid var(--accent)}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#0b1b5c;color:#fff;padding:8px 8px 8px 16px;min-height:44px;border-radius:22px;z-index:50;box-shadow:var(--shadow);max-width:92vw;font-weight:600;display:flex;align-items:center;gap:10px}
.toast button{border:0;background:var(--yellow);color:var(--navy);font-weight:700;border-radius:18px;min-height:36px;padding:0 14px;flex:none;position:relative}
.toast button::before{content:'';position:absolute;inset:-4px}
.toast:not(:has(button)){padding-right:16px}
@media (min-width:760px){.toast{top:auto;bottom:24px}}
dialog{border:0;border-radius:var(--radius);padding:0;max-width:min(92vw,520px);width:100%;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,12,83,.5)}
dialog .body{padding:20px}
.fade{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:18px;height:18px;border:3px solid rgba(0,0,0,.15);border-top-color:var(--brand-2);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==================================================================
   Device bands. Phone under 600: the places in a bar at the bottom.
   Tablet 600 to 1023: one column, the places under the top bar.
   Laptop 1024 and up: a sidebar (or, in Editorial, a row across the
   top), and pages that open into two leaves or three columns.
   ================================================================== */
@media (max-width:599px){
  .app{padding:0 12px calc(86px + env(safe-area-inset-bottom))}
  .topbar{margin:0 -12px 12px;padding:8px 12px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;gap:2px;padding:4px 6px calc(6px + env(safe-area-inset-bottom));background:var(--nav-bg);border-top:1px solid var(--line)}
  .tab{flex-direction:column;gap:2px;min-height:60px;padding:4px 2px;font-size:.76em;border-radius:12px;background:transparent!important}
  .tab .ti{width:56px;height:30px;border-radius:15px}
  .tab.on{color:var(--nav-on-text)}
  .tab.on .ti{background:var(--nav-on-bg);color:var(--nav-on-ink)}
  .tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  body.typing .tabs{display:none}
  body.typing .app{padding-bottom:24px}
  .toast{top:auto;bottom:calc(84px + env(safe-area-inset-bottom))}
  body.typing .toast,body.composing .toast{bottom:auto;top:12px}
  .wheelwrap{max-width:300px}
  .cmain .ring{display:none}
}
@media (max-width:599px){.tab.t-comp{flex-grow:1.35}}
@media (max-width:359px){.tab{font-size:12px}.tab .ti{width:46px}.tabs{padding-left:2px;padding-right:2px;gap:0}}
@media (max-height:500px) and (orientation:landscape) and (max-width:1023px){.wheelwrap{max-width:280px}}
@media (min-width:600px){
  .app{padding:0 20px 28px}
  .topbar{margin:0 -20px 12px;padding:10px 20px}
  .cmain textarea.in{min-height:140px}
}
/* phone and tablet: Home's columns become one, in a useful order */
@media (max-width:1023px){
  .page.cols{display:flex;flex-direction:column}
  .page.cols>.col{display:contents}
  .page.cols>.col>*{order:var(--o,20)}
  .spread>.leaf+.leaf{margin-top:2px}
}
/* laptop */
@media (min-width:1024px){
  .app{max-width:none;padding:0;display:grid;grid-template-columns:264px minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"top main" "nav main" "nav foot";min-height:100vh;background:linear-gradient(90deg,var(--side-bg) 0 264px,var(--side-line) 264px 265px,transparent 265px)}
  .topbar{grid-area:top;margin:0;padding:22px 18px 14px;background:transparent;border:0;align-self:start}
  .tabs{grid-area:nav;flex-direction:column;gap:4px;margin:0;padding:6px 14px 24px;align-self:start;position:sticky;top:0}
  .tab{flex:none;justify-content:flex-start;gap:12px;padding:10px 14px;font-size:1em;min-height:48px}
  .navnew{display:flex;flex-direction:column;gap:8px;margin-top:22px}
  .navnew .btn{width:100%}
  .page{grid-area:main;padding:28px 32px 8px;max-width:1560px;width:100%}
  .footer{grid-area:foot;padding:10px 32px 22px;text-align:left}
  .page.spread{display:grid;grid-template-columns:var(--split,minmax(0,1fr) minmax(0,1fr));gap:24px;align-items:start}
  .page.spread>.leaf{min-width:0}
  .page.cols{display:grid;gap:20px;align-items:start;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"c1 c3" "c2 c3"}
  .page.cols>.c1{grid-area:c1}.page.cols>.c2{grid-area:c2}.page.cols>.c3{grid-area:c3}
  .home .acts{display:none}
  .lstick{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;overscroll-behavior:contain;padding:2px 8px 10px 2px;margin:-2px -8px 0 -2px;scrollbar-width:thin}
  .sortby .seg.icons{flex:none}
  .leaf.r .entrycard{margin-top:0}
  .wheelwrap{max-width:440px}
  /* settings: an index of sections, one section at a time */
  .settingsspread .jumps{display:none}
  .snav{display:flex;flex-direction:column;gap:3px;margin-top:16px}
  .snav a{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:10px;color:var(--text);font-weight:600;text-decoration:none}
  .snav a:hover{background:var(--surface-2)}
  .snav a svg{width:19px;height:19px}
  .snav a.on{background:var(--btn-bg);color:var(--btn-ink)}
  .settingsspread .leaf.l .hero{position:sticky;top:20px}
  .settingsspread .leaf.r>section{max-width:780px}
  .askpage{max-width:820px}
  /* welcome: the cover on the left, the forms on the right */
  .welcome{max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start;align-content:center;min-height:100vh;padding:32px}
  .welcome .cover-big{position:sticky;top:24px;min-height:440px;display:flex;flex-direction:column;justify-content:center;margin:0}
  .welcome .cover-big h1{font-size:3.2em}
  /* the editor: a writing page and a guide */
  .sheet .inner{max-width:1240px;padding-left:28px;padding-right:28px}
  .sheet .bar{margin:0 -28px 6px;padding:12px 28px}
  .cbody{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);gap:28px;align-items:start}
  .cbody.solo{grid-template-columns:minmax(0,720px);justify-content:center}
  .cmain .ring{display:none}
  .guide{display:block;position:sticky;top:84px;margin-top:40px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin;background:var(--surface);border-radius:var(--radius);padding:20px 20px 16px;box-shadow:var(--shadow-card);border:var(--card-border)}
  .guide .ring{width:120px;height:120px;margin:0 auto 6px}
  .gsteps{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:3px}
  .gsteps button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 10px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;font-weight:600}
  .gsteps button:hover:not([disabled]){background:var(--surface-2)}
  .gsteps button.on{background:var(--btn-bg);color:var(--btn-ink)}
  .gsteps button[disabled]{opacity:.5;cursor:default}
  .gmark{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);font-size:.85em;font-weight:800;color:var(--text-2);background:var(--surface)}
  .gmark svg{width:15px;height:15px}
  .gsteps button.done .gmark{background:var(--ok);border-color:var(--ok);color:#fff}
  .gsteps button.on .gmark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .gabout,.gtip{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .gabout p,.gtip p{margin:0 0 6px}
  .gtip p{font-family:var(--quote-font);color:var(--head)}
}
@media (min-width:1280px){
  .page.cols{grid-template-columns:minmax(360px,1.15fr) minmax(0,1fr) minmax(0,1fr);grid-template-areas:"c1 c2 c3"}
}
@media (min-width:1440px){:root{--fs:17px}.wheelwrap{max-width:500px}}

/* ==================================================================
   A. Case and notebooks: a cloth case, cream lined paper, ribbon tabs.
   ================================================================== */
body[data-look="a"]{
  --brand:#13205c; --brand-2:#2a3f9e;
  --bg:var(--brand); --bg-img:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.12) 0 2px,transparent 2px 5px);
  --on-bg:#ffffff; --on-bg-2:rgba(255,255,255,.88);
  --paper:#fbf7ec; --rule:#e8e1cf; --margin:#e9b8b0;
  --surface:#ffffff; --surface-2:#f6f1e3; --surface-3:#efe8d6;
  --text:#1d2140; --text-2:#4a4d63; --kick:#8a3b2e; --line:#e3dac4; --line-2:#d3c7aa; --head:var(--brand); --link:#1f3fa8;
  --top-bg:transparent; --top-ink:#ffffff; --top-sub:rgba(255,255,255,.86); --top-line:transparent;
  --side-bg:transparent; --side-line:transparent;
  --nav-bg:var(--brand); --nav-ink:#2f2e28; --nav-on-bg:var(--paper); --nav-on-ink:var(--brand); --nav-on-text:var(--brand);
  --hero-bg:linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.18)); --hero-ink:#ffffff; --hero-ink-2:rgba(255,255,255,.88);
  --meter:#e3dac4; --meter-on:var(--brand); --wheel-bg:#ffffff;
  --head-font:var(--serif); --head-weight:700; --body-font:Calibri,Carlito,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --radius:12px; --btn-radius:999px; --card-border:1px solid var(--line); --shadow-card:0 2px 0 var(--line);
}
body[data-look="a"][data-colour="forest"]{--brand:#1d4a37;--brand-2:#23704b}
body[data-look="a"][data-colour="plum"]{--brand:#4a2a5c;--brand-2:#74419a}
body[data-look="a"][data-colour="crimson"]{--brand:#861c27;--brand-2:#b02d3b}
body[data-look="a"][data-colour="teal"]{--brand:#0e5461;--brand-2:#14707f}
body[data-look="a"][data-colour="ochre"]{--brand:#6b4d0c;--brand-2:#8a6210}
body[data-look="a"][data-theme="dark"]{--paper:#151a30;--rule:#1f2546;--margin:#4a2433;--surface:#1b2142;--surface-2:#20274d;--surface-3:#29315f;--text:#eef0ff;--text-2:#b4bae0;--kick:#ffb4a8;--line:#2c3466;--line-2:#3b4580;--head:#ffffff;--link:#a9bbff;--nav-ink:#dfe3ff;--wheel-bg:#1b2142;--meter:#2c3466;--meter-on:#FFE200;--brand-2:#8ea2ff}
body[data-look="a"] .avatar{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 8px rgba(0,0,0,.25)}
body[data-look="a"] .topbar{border:0}
body[data-look="a"] .brand .word{color:#f3d77a}
body[data-look="a"] .tab{background:#cfc6ad;border-radius:10px 10px 0 0}
body[data-look="a"][data-theme="dark"] .tab{background:#2a3156}
