<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind the Gap — a group game about generations</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --paper:#faf6ee; --paper2:#f3ecde; --card:#fffdf8; --ink:#211c15; --ink2:#5f5647; --ink3:#9b8f7c;
    --line:#e7ddca; --line2:#d9ccb2;
    --coral:#e0563f; --amber:#d8902b; --teal:#3d7d8f; --green:#4a8a5c; --violet:#7b5aa6; --brick:#b5432f;
    --gold:#d8902b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100vh;min-height:100dvh;font-family:'Outfit',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  body{background-image:radial-gradient(ellipse at 12% -5%,rgba(216,144,43,0.10),transparent 42%),radial-gradient(ellipse at 100% 0%,rgba(61,125,143,0.08),transparent 45%),radial-gradient(ellipse at 50% 120%,rgba(224,86,63,0.06),transparent 55%);}
  .serif{font-family:'DM Serif Display',Georgia,serif;}
  .hand{font-family:'Caveat',cursive;}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 20px 60px;}
  .fade{animation:fade .5s cubic-bezier(.22,1,.36,1) both;}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--coral),var(--amber));box-shadow:0 2px 8px rgba(224,86,63,.3)}
  .rlabel{font-size:.82rem;font-weight:700;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .timer.run{border-color:var(--coral);color:var(--coral)}
  .timer .mini{font-size:.7rem;color:var(--ink3);font-weight:600}

  /* scorebar */
  .scorebar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .tchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:700;font-size:.9rem;}
  .tchip .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .tchip .sc{margin-left:2px;font-variant-numeric:tabular-nums;background:var(--paper2);border-radius:7px;padding:1px 8px;font-size:.85rem;color:var(--ink)}
  .tchip .bolds{font-size:.68rem;letter-spacing:1px;margin-left:1px}
  .tchip.lead{border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,144,43,.18)}

  /* cards + prompt */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 34px -20px rgba(60,40,10,.35);}
  .prompt{padding:clamp(22px,4vw,44px);text-align:center;}
  .kicker{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--ink3);margin-bottom:16px}
  .voice{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(1.5rem,4.2vw,3rem);line-height:1.16;letter-spacing:-.01em;color:var(--ink);}
  .voice .q{color:var(--line2)}
  .setup-line{font-size:clamp(1.15rem,2.6vw,1.7rem);line-height:1.4;color:var(--ink)}
  .instruction{margin-top:22px;font-size:clamp(1rem,2vw,1.15rem);color:var(--ink2);font-weight:600}
  .filed{margin-top:16px;display:inline-block;background:var(--paper2);border:1px dashed var(--line2);border-radius:12px;padding:9px 15px;color:var(--ink2);font-weight:600;font-style:italic;font-size:.95rem}
  .fnote{margin-top:16px;color:var(--ink3);font-size:.82rem;font-weight:600}
  .stake{margin-top:18px;display:inline-flex;gap:9px;align-items:center;background:#fff;border:1.5px solid var(--line2);border-radius:12px;padding:9px 15px;font-weight:700;font-size:.9rem;color:var(--ink2)}
  .stake b{color:var(--amber)}

  /* reference / value chips */
  .chiprow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
  .rchip{--c:#999;display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 15px 8px 11px;font-weight:700;font-size:.92rem;transition:all .3s;}
  .rchip .n{width:22px;height:22px;border-radius:50%;background:var(--paper2);color:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
  .rchip .sub{color:var(--ink3);font-weight:600;font-size:.78rem}
  .rchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
  .rchip.on .n{background:var(--c);color:#fff}
  .rchip.dim{opacity:.4}
  .optcol{display:flex;flex-direction:column;gap:12px;margin-top:26px;max-width:660px;margin-left:auto;margin-right:auto;text-align:left}
  .opt{--c:var(--teal);display:flex;gap:13px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:15px 17px;font-weight:600;font-size:1.02rem;line-height:1.4;transition:all .3s}
  .opt .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper2);color:var(--ink3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem}
  .opt.right{border-color:var(--green);background:rgba(74,138,92,.09)}
  .opt.right .n{background:var(--green);color:#fff}
  .opt.wrong{opacity:.55}
  .opt.wrong .n{background:#e9d9d9;color:var(--brick)}

  /* reveal */
  .reveal{padding:clamp(22px,4vw,40px);}
  .revhead{text-align:center;margin-bottom:20px}
  .valbig{--c:var(--coral);display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:16px 34px;border-radius:18px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
  .valbig .lab{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
  .valbig .nm{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--c);line-height:1}
  .valbig .tg{color:var(--ink2);font-weight:600;font-size:.95rem}
  .tell{max-width:680px;margin:20px auto 0;text-align:center;font-size:clamp(1.02rem,2.1vw,1.2rem);line-height:1.5;color:var(--ink)}
  .twovals{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px auto 0}
  .vmini{--c:#999;display:flex;align-items:center;gap:8px;font-weight:800;border:1.5px solid var(--c);border-radius:12px;padding:8px 15px;color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
  .vmini .sw{width:11px;height:11px;border-radius:3px;background:var(--c)}
  .clash{text-align:center;font-weight:700;color:var(--ink3);margin:12px 0}
  .bridge{max-width:700px;margin:22px auto 0;background:var(--paper2);border:1px solid var(--line2);border-radius:16px;padding:18px 20px;}
  .bridge .h{font-weight:800;color:var(--teal);letter-spacing:.02em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .bridge .b{color:var(--ink);font-size:1.05rem;line-height:1.5}

  /* scoring rows */
  .awardwrap{max-width:820px;margin:24px auto 0}
  .awardttl{text-align:center;font-weight:700;color:var(--ink2);font-size:.9rem;margin-bottom:12px}
  .awardttl .sub{color:var(--ink3);font-weight:600}
  .awardgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .ocard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;min-width:214px;flex:0 1 auto}
  .oname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;margin-bottom:8px}
  .oname .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .obtns{display:flex;gap:6px}
  .obtn{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 5px;font-weight:800;font-size:.78rem;cursor:pointer;color:var(--ink2);transition:.15s;font-variant-numeric:tabular-nums;white-space:nowrap}
  .obtn:hover:not(:disabled){border-color:var(--line2);transform:translateY(-1px)}
  .obtn:disabled{opacity:.32;cursor:not-allowed}
  .obtn.on.safe{background:var(--green);color:#fff;border-color:transparent}
  .obtn.on.win{background:var(--amber);color:#fff;border-color:transparent}
  .obtn.on.miss{background:var(--brick);color:#fff;border-color:transparent}
  .abtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .18s;color:var(--ink2)}
  .abtn .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .abtn .pl{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink3)}
  .abtn:hover{border-color:var(--line2)}
  .abtn.on{color:#fff;border-color:transparent}
  .abtn.on .pl{color:rgba(255,255,255,.85)}

  /* buttons */
  .row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:30px}
  .btn{font-weight:700;border-radius:12px;padding:14px 26px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-size:1rem;transition:all .2s}
  .btn:hover{border-color:var(--line2);transform:translateY(-1px)}
  .btn-lg{padding:16px 40px;font-size:1.08rem}
  .btn-primary{background:linear-gradient(135deg,var(--coral),#c8452f);color:#fff;border-color:transparent;box-shadow:0 8px 22px -8px rgba(224,86,63,.6)}
  .btn-primary:hover{box-shadow:0 12px 28px -8px rgba(224,86,63,.7)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink3)}
  .btn-ghost:hover{color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  /* round card / pivot / hero */
  .hero{text-align:center;padding:clamp(24px,5vw,56px) clamp(18px,4vw,44px)}
  .hero h1{font-family:'DM Serif Display',serif;font-size:clamp(2.6rem,8vw,5rem);line-height:.98;letter-spacing:-.02em;margin:6px 0 4px}
  .hero .tag{font-size:clamp(1.05rem,2.4vw,1.4rem);color:var(--ink2);font-weight:600;max-width:660px;margin:14px auto 0;line-height:1.45}
  .hero .tag b{color:var(--coral)}
  .steps{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:30px auto 0;max-width:880px}
  .step{flex:1 1 200px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left}
  .step .no{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--amber);line-height:1}
  .step h3{font-weight:800;margin:6px 0 4px;font-size:1.02rem}
  .step p{color:var(--ink2);font-size:.92rem;line-height:1.45}
  .roundcard{text-align:center;padding:clamp(30px,6vw,70px) 20px}
  .roundcard .num{font-family:'Caveat',cursive;font-size:clamp(2rem,5vw,3rem);color:var(--amber);line-height:1}
  .roundcard h2{font-family:'DM Serif Display',serif;font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.02;letter-spacing:-.02em;margin:2px 0 12px}
  .roundcard .rule{font-size:clamp(1.05rem,2.4vw,1.35rem);color:var(--ink2);font-weight:600;max-width:660px;margin:0 auto;line-height:1.45}
  .standings{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px auto 0;max-width:720px}
  .stand{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
  .stand .sw{width:12px;height:12px;border-radius:4px}
  .stand .sc{font-variant-numeric:tabular-nums;color:var(--ink2)}

  /* team setup */
  .teamlist{display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto}
  .teamrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .teamrow .sw{width:26px;height:26px;border-radius:9px;flex:none}
  .teamrow input{flex:1;border:none;background:transparent;font-size:1.05rem;font-weight:700;color:var(--ink);outline:none;font-family:inherit}
  .teamrow input::placeholder{color:var(--ink3);font-weight:600}
  .teamrow .x{border:none;background:var(--paper2);color:var(--ink3);width:30px;height:30px;border-radius:9px;cursor:pointer;font-weight:800;font-size:1.1rem;line-height:1}
  .teamrow .x:hover{background:#ecdada;color:var(--brick)}
  .toggle{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:20px;color:var(--ink2);font-weight:600;cursor:pointer;user-select:none}
  .toggle .box{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;transition:.2s;flex:none}
  .toggle .box::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on .box{background:var(--green)}
  .toggle.on .box::after{left:21px}

  /* end / share */
  .valgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:22px auto 0;max-width:760px}
  .vcard{--c:#999;flex:1 1 150px;max-width:220px;border:1.5px solid var(--c);border-radius:16px;padding:16px;background:color-mix(in srgb,var(--c) 8%,#fff);text-align:center}
  .vcard .nm{font-family:'DM Serif Display',serif;font-size:1.35rem;color:var(--c);line-height:1}
  .vcard .tg{color:var(--ink2);font-size:.85rem;font-weight:600;margin-top:5px;line-height:1.35}
  .winner{text-align:center;margin:8px auto 0}
  .winner .crown{font-size:2.4rem}
  .winner .nm{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1}
  .debrief{max-width:720px;margin:26px auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;text-align:left}
  .debrief h3{font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .debrief li{color:var(--ink);line-height:1.5;margin:8px 0 8px 4px;list-style:none;padding-left:22px;position:relative}
  .debrief li::before{content:'→';position:absolute;left:0;color:var(--amber);font-weight:800}
  .sharecard{width:600px;background:linear-gradient(150deg,#fffdf8,#f3ecde);padding:44px;border:1px solid var(--line)}

  @media (max-width:640px){
    .wrap{padding:14px 14px 48px}
    .brand span{display:none}
    .opt{font-size:.95rem}
    .ocard{min-width:0;flex:1 1 100%}
    .sharecard{width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><span>Mind the Gap</span></div>
    <div id="topright" style="display:flex;gap:8px;align-items:center"></div>
  </div>
  <div id="scorebar"></div>
  <div id="app"></div>
</div>

<!-- hidden share card render target -->
<div style="position:fixed;left:-9999px;top:0"><div id="sharecard" class="sharecard"></div></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app'), scorebar=$('#scorebar'), topright=$('#topright');

/* ============================== CONTENT ============================== */
/* All content below is original, written for this game — not quoted from
   any source. Generation names and year ranges are factual reference. */

const VALUES={
  purpose:{name:'Purpose',  c:'#e0563f', tag:'the work has to mean something'},
  growth:{name:'Growth',    c:'#4a8a5c', tag:'I need to be getting better'},
  security:{name:'Security',c:'#3d7d8f', tag:'stability I can build a life on'},
  autonomy:{name:'Autonomy',c:'#d8902b', tag:'trust me to find the path'},
  belonging:{name:'Belonging',c:'#7b5aa6', tag:'I want to be in the room, and heard'},
  respect:{name:'Respect',  c:'#b5432f', tag:'take me — and my time — seriously'},
};
const VORDER=['purpose','growth','security','autonomy','belonging','respect'];
const GENS=[
  {k:'boomer',name:'Baby Boomers',range:'1950–64',c:'#b5432f'},
  {k:'x',     name:'Gen X',       range:'1965–79',c:'#d8902b'},
  {k:'mil',   name:'Millennials', range:'1980–94',c:'#3d7d8f'},
  {k:'z',     name:'Gen Z',       range:'1995–2009',c:'#7b5aa6'},
];

/* Round 1 — Snap Judgment (unscored trap). Guess the generation → reveal
   it was heard across all four, and name the value underneath. */
const R1=[
  {v:'Just tell me the point before you book the meeting. If it’s a real decision, I’m there. If it’s a status update, send the note.',
   value:'respect', tell:'One of the most common asks in every age group. It’s respect for people’s time — not a young-person thing.'},
  {v:'I don’t need a pat on the back. I need to know the plan is stable enough to build a life around.',
   value:'security', tell:'Written by a 26-year-old servicing a housing loan. Security tracks life-stage, not birth year.'},
  {v:'If the only reason we do it this way is “we’ve always done it this way,” I’ll go find a better way.',
   value:'purpose', tell:'Said by a 56-year-old engineer. Asking “why” isn’t youth — it’s curiosity.'},
  {v:'Give me the goal and the one line I can’t cross, then let me run. I’ll shout if I’m stuck.',
   value:'autonomy', tell:'Just as common among Gen Z new hires who grew up teaching themselves online.'},
  {v:'Say my name in the room when you use my idea. That’s the whole ask.',
   value:'belonging', tell:'Written by a 61-year-old, remembering exactly how it felt when it didn’t happen to them.'},
  {v:'Tell me while the work is still warm — not six months later at appraisal.',
   value:'growth', tell:'Boomers asked for this just as often. Nobody does their best with stale feedback.'},
];

/* Round 2 — Read the Value (scored). Name the value underneath the voice. */
const R2=[
  {v:'I’ll stay till midnight for something that matters. I won’t stay ten minutes to look busy.',
   value:'purpose', tell:'The tell is “matters” vs “look busy.” They’re guarding meaning, not hours.'},
  {v:'I took this role for what I’d learn in it. The day the learning stops, I start looking.',
   value:'growth', tell:'Not disloyalty — a growth engine. Feed it and they stay.'},
  {v:'I can’t take a smart risk at work if one bad month means I can’t make rent.',
   value:'security', tell:'Sort the floor before you ask for the ceiling. Safety first, courage second.'},
  {v:'Hand me the outcome and the guardrails. I’ll find the path myself.',
   value:'autonomy', tell:'Being trusted with the “how” is the reward they’re after.'},
  {v:'If I only ever hear the final decision, I’ll assume I wasn’t wanted in the room.',
   value:'belonging', tell:'It’s not about the decision — it’s about being counted as part of it.'},
  {v:'Don’t rearrange my role and tell me by email. Ask me first.',
   value:'respect', tell:'Consultation is the currency. Being handled feels like being erased.'},
];

/* Optional discussion beat — no single right answer, insight bonus only. */
const DECODE=[
  {phrase:'“Let’s take this offline.”',
   reads:[
     {value:'respect',  text:'Protecting the room’s time — and someone’s dignity — from a public pile-on.'},
     {value:'autonomy', text:'Wanting to sort it directly, without an audience.'},
     {value:'security', text:'Buying time because it doesn’t feel safe to disagree here yet.'}],
   note:'Three people say the same four words and mean three different things. So ask — don’t assume.'},
  {phrase:'Silence, when you ask a team “any concerns?”',
   reads:[
     {value:'security',  text:'“I don’t feel safe enough to say the real thing.”'},
     {value:'respect',   text:'“It’s not my place to cut across you.”'},
     {value:'belonging', text:'“I’m not sure my voice is actually wanted here.”'}],
   note:'Silence is not agreement. Same silence, very different values underneath.'},
];

/* Round 3 — Mind the Gap (scored). Diagnose the real driver, then bridge. */
const R3=[
  {title:'The desk-side vs the message',
   setup:'A senior officer keeps walking over to a new hire’s desk to talk things through. The new hire asks them to message instead. The senior feels brushed off; the junior feels constantly interrupted.',
   filed:'Filed as: “young people avoid real conversation.”',
   options:[
     {t:'One won’t adapt to new tools; the other avoids people.',ok:false},
     {t:'One is protecting connection; the other is protecting focus. Two fair values, colliding.',ok:true},
     {t:'Pick one channel for everyone and enforce it.',ok:false}],
   valA:'belonging', valB:'autonomy',
   bridge:'Async by default for updates; one standing 10-minute desk-side chat a day. Connection and focus both get a home — no one has to lose.'},
  {title:'The “good job” that stung',
   setup:'A manager tosses a quick “nice work!” in passing. The new hire looks deflated. Word gets back that they’re “needy” and “can’t take a compliment.”',
   filed:'Filed as: “this generation fishes for praise.”',
   options:[
     {t:'They’re asking to get better and don’t have the words for it yet — a growth request, not neediness.',ok:true},
     {t:'They lack confidence and need a resilience workshop.',ok:false},
     {t:'They want constant validation — just praise them more.',ok:false}],
   valA:'growth', valB:'respect',
   bridge:'Ask outright: “Do you want a cheer or a coach right now?” Then give one specific thing to keep and one to change. Praise ≠ development.'},
  {title:'The stay-late standoff',
   setup:'One colleague leaves right on time every day. Another regularly stays late. Each quietly judges the other — “not committed” vs “poor boundaries.”',
   filed:'Filed as: “a generational work-ethic gap.”',
   options:[
     {t:'One generation is lazy; the other is a workaholic.',ok:false},
     {t:'Both are trying to prove commitment — they just trust different signals: hours-seen vs outcomes-shipped.',ok:true},
     {t:'Set a minimum hours-in-seat rule for everyone.',ok:false}],
   valA:'purpose', valB:'security',
   bridge:'Name out loud what “committed” looks like on this team — and measure the outcome, not the optics. Same value; agree on the signal.'},
];

const TEAM_COLORS=['#e0563f','#2f8f83','#d8902b','#6b6ac9','#4a9a5c','#c0507a'];
/* game economy */
const BOLD_MAX=3, SAFE=5, BOLDWIN=15, BOLDMISS=-5, BONUS=5;

/* ============================== STATE ============================== */
let S={ screen:'intro', teams:[], seq:[], step:0, includeDecode:true, results:{}, bonus:{}, timer:{rem:0,run:false,id:null} };

function defaultTeams(){ return [
  {name:'',color:TEAM_COLORS[0]},
  {name:'',color:TEAM_COLORS[1]},
]; }
S.teams=defaultTeams();

/* derived scoring — points come only from reading values; Bold reads are scarce */
function scoreOf(ti){
  let s=0;
  for(const k in S.results){ if(+k.split(':')[1]!==ti) continue; const o=S.results[k];
    s += o==='safe'?SAFE : o==='boldWin'?BOLDWIN : o==='boldMiss'?BOLDMISS : 0; }
  for(const k in S.bonus){ if(+k.split(':')[2]===ti) s+=BONUS; }
  return s;
}
function boldUsed(ti){ let n=0; for(const k in S.results){ const o=S.results[k]; if(+k.split(':')[1]===ti&&(o==='boldWin'||o==='boldMiss')) n++; } return n; }
function boldLeft(ti){ return BOLD_MAX-boldUsed(ti); }
function boldDots(ti){ const L=boldLeft(ti); let s=''; for(let j=0;j<BOLD_MAX;j++) s+=`<span style="opacity:${j<L?1:.22}">⚡</span>`; return s; }

/* ============================== HELPERS ============================== */
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function teamName(t,i){ return (t.name&&t.name.trim())?t.name.trim():('Team '+(i+1)); }
function leaders(){ const m=Math.max(...S.teams.map((t,i)=>scoreOf(i))); return m>0?m:-1; }

function buildSequence(){
  const q=[];
  q.push({t:'round',round:1,num:'Warm-up',title:'Snap Judgment',rule:'Guess the generation out loud, as a team. No points this round — just notice how confident, and how wrong, it feels.'});
  R1.forEach((it,i)=>{ q.push({t:'r1p',i}); q.push({t:'r1r',i}); });
  q.push({t:'pivot'});
  q.push({t:'round',round:2,num:'Round 1',title:'Read the Value',rule:'A right read is worth +5. Sure enough to bet? Spend one of your three ⚡ Bold reads: +15 if right, −5 if wrong.'});
  R2.forEach((it,i)=>{ q.push({t:'r2p',i}); q.push({t:'r2r',i}); });
  if(S.includeDecode){
    q.push({t:'round',round:'d',num:'Interlude',title:'Decode Together',rule:'No single right answer here. Talk it out — a sharp read earns a bonus.'});
    DECODE.forEach((it,i)=>{ q.push({t:'dp',i}); q.push({t:'dr',i}); });
  }
  q.push({t:'round',round:3,num:'Round 2',title:'Mind the Gap',rule:'Each clash got blamed on age. Name what it’s really about (Safe +5 / ⚡ Bold +15/−5), then win a bonus for the best bridge.'});
  R3.forEach((it,i)=>{ q.push({t:'r3p',i}); q.push({t:'r3r',i}); });
  q.push({t:'end'});
  S.seq=q; S.step=0;
}

/* scored items: exclusive outcome per team (safe / bold-win / bold-miss) */
function setOutcome(ti,outcome){
  const k=S.step+':'+ti, cur=S.results[k];
  if(cur===outcome){ delete S.results[k]; render(); return; }
  const goingBold=(outcome==='boldWin'||outcome==='boldMiss');
  const curBold=(cur==='boldWin'||cur==='boldMiss');
  if(goingBold && !curBold && boldLeft(ti)<=0) return; // out of Bold reads
  S.results[k]=outcome; render();
}
/* discussion bonuses: simple flat toggle */
function toggleBonus(type,ti){ const k=S.step+':'+type+':'+ti; if(S.bonus[k]) delete S.bonus[k]; else S.bonus[k]=true; render(); }

/* timer */
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0'); }
function timerTick(){ if(S.timer.rem>0){ S.timer.rem--; paintTimer(); } if(S.timer.rem<=0){ stopTimer(); } }
function startTimer(){ if(S.timer.run) return; if(S.timer.rem<=0) S.timer.rem=45; S.timer.run=true; S.timer.id=setInterval(timerTick,1000); paintTimer(); }
function stopTimer(){ S.timer.run=false; if(S.timer.id){ clearInterval(S.timer.id); S.timer.id=null; } paintTimer(); }
function resetTimer(){ stopTimer(); S.timer.rem=45; paintTimer(); }
function paintTimer(){ const el=$('#timer'); if(!el) return; el.classList.toggle('run',S.timer.run); el.querySelector('.tt').textContent=fmt(S.timer.rem); }

/* ============================== NAV ============================== */
function go(screen){ S.screen=screen; render(); scrollTo({top:0,behavior:'smooth'}); }
function next(){ if(S.step<S.seq.length-1){ S.step++; resetTimer(); render(); scrollTo({top:0,behavior:'smooth'}); } }
function back(){ if(S.step>0){ S.step--; render(); scrollTo({top:0,behavior:'smooth'}); } }

/* ============================== RENDER ============================== */
function render(){
  const playing=(S.screen==='play');
  const st = playing ? S.seq[S.step] : null;
  const showChrome = playing && st && st.t!=='round' && st.t!=='pivot' && st.t!=='end';
  topright.innerHTML = showChrome ? `
    <span class="rlabel">${roundLabelFor()}</span>
    <span id="timer" class="timer" data-action="timer"><span class="mini">⏱</span><span class="tt">${fmt(S.timer.rem||45)}</span></span>` : '';
  scorebar.innerHTML = (playing && S.teams.length && st && st.t!=='end') ? scoreStrip() : '';

  if(S.screen==='intro')  return void(app.innerHTML=Intro());
  if(S.screen==='teams')  return void(app.innerHTML=Teams());
  if(S.screen==='play')   return void(app.innerHTML=Play(st));
}
function roundLabelFor(){
  for(let i=S.step;i>=0;i--){ if(S.seq[i].t==='round'){ const r=S.seq[i]; return `${r.num} · ${r.title}`; } }
  return '';
}
function scoreStrip(){
  const lead=leaders();
  return S.teams.map((t,i)=>{ const sc=scoreOf(i); return `<div class="tchip ${sc===lead&&lead>0?'lead':''}">
    <span class="sw" style="background:${t.color}"></span>${esc(teamName(t,i))}
    <span class="sc">${sc}</span><span class="bolds" title="Bold reads left">${boldDots(i)}</span></div>`; }).join('');
}
function standings(){
  const lead=leaders();
  const arr=S.teams.map((t,i)=>({t,i,sc:scoreOf(i)})).sort((a,b)=>b.sc-a.sc);
  return `<div class="standings">${arr.map(({t,i,sc})=>`<div class="stand">
    <span class="sw" style="background:${t.color}"></span>${esc(teamName(t,i))}
    <span class="sc">${sc}${sc===lead&&lead>0?' 👑':''}</span></div>`).join('')}</div>`;
}

/* ---------- Intro ---------- */
function Intro(){
  return `<div class="card hero fade">
    <div class="kicker">A group game about generations</div>
    <h1>Mind the Gap</h1>
    <p class="tag">Guess the age. Miss the point. Find the <b>value</b>.<br>
      A team game rigged to prove one thing — the gap between us runs on values, not birthdays.</p>
    <div class="steps">
      <div class="step"><div class="no">1</div><h3>Make teams</h3><p>2–6 of them. Answer by shout, a held-up card, or a quick table vote. The facilitator drives the screen.</p></div>
      <div class="step"><div class="no">2</div><h3>The objective</h3><p>Most points wins — and points come only from reading what a person <em>values</em>, never from guessing which generation they are.</p></div>
      <div class="step"><div class="no">3</div><h3>The trade-off</h3><p>Each team gets just <b>3 Bold reads</b> all game. Play safe (+5), or go Bold (+15 if right, <b>−5 if wrong</b>). Spend them when you’re sure.</p></div>
      <div class="step"><div class="no">4</div><h3>The point</h3><p>On the final scoreboard, the winners are simply whoever stopped guessing ages and started reading values.</p></div>
    </div>
    <div class="row">
      <button class="btn btn-primary btn-lg" data-action="toTeams">Set up teams →</button>
    </div>
    <p class="fnote">Voices and scenarios are illustrative — written for the game, not quoted from anyone. Best on a screen everyone can see.</p>
  </div>`;
}

/* ---------- Team setup ---------- */
function Teams(){
  return `<div class="card prompt fade" style="text-align:left">
    <div style="text-align:center" class="kicker">Who’s playing?</div>
    <div class="teamlist">
      ${S.teams.map((t,i)=>`<div class="teamrow">
        <span class="sw" style="background:${t.color}"></span>
        <input data-team="${i}" value="${esc(t.name)}" placeholder="${'Team '+(i+1)}" maxlength="22">
        ${S.teams.length>2?`<button class="x" data-action="rmTeam" data-team="${i}" title="Remove">×</button>`:''}
      </div>`).join('')}
    </div>
    <div class="row" style="margin-top:18px">
      ${S.teams.length<6?`<button class="btn" data-action="addTeam">+ Add team</button>`:''}
    </div>
    <div class="toggle ${S.includeDecode?'on':''}" data-action="toggleDecode">
      <span class="box"></span><span>Include the “Decode Together” discussion interlude</span>
    </div>
    <div class="row">
      <button class="btn btn-ghost" data-action="toIntro">← Back</button>
      <button class="btn btn-primary btn-lg" data-action="startGame">Start the game →</button>
    </div>
    <p class="fnote" style="text-align:center">Each team starts with 3 ⚡ Bold reads. Name teams something loud — the scoreboard’s more fun with personality.</p>
  </div>`;
}

/* ---------- Play dispatch ---------- */
function Play(st){
  switch(st.t){
    case 'round': return RoundCard(st);
    case 'pivot': return Pivot();
    case 'r1p':   return R1Prompt(st.i);
    case 'r1r':   return R1Reveal(st.i);
    case 'r2p':   return R2Prompt(st.i);
    case 'r2r':   return R2Reveal(st.i);
    case 'dp':    return DecodePrompt(st.i);
    case 'dr':    return DecodeReveal(st.i);
    case 'r3p':   return R3Prompt(st.i);
    case 'r3r':   return R3Reveal(st.i);
    case 'end':   return End();
  }
  return '';
}
function navRow(primaryLabel){
  return `<div class="row">
    <button class="btn btn-ghost" data-action="back">← Back</button>
    <button class="btn btn-primary btn-lg" data-action="next">${primaryLabel||'Next →'}</button>
  </div>`;
}
function revealRow(){
  return `<div class="row">
    <button class="btn btn-ghost" data-action="back">← Back</button>
    <button class="btn btn-primary btn-lg" data-action="next">Reveal →</button>
  </div>`;
}
function stakeTag(){ return `<div class="stake">⚡ <span>Safe <b>+${SAFE}</b> &nbsp;·&nbsp; Bold <b>+${BOLDWIN}</b> / <b>${BOLDMISS}</b> &nbsp;·&nbsp; 3 Bold reads all game</span></div>`; }

function RoundCard(st){
  const showStand = st.round!==1;
  return `<div class="card roundcard fade">
    <div class="num">${st.num}</div>
    <h2>${st.title}</h2>
    <p class="rule">${st.rule}</p>
    ${showStand?standings():''}
    <div class="row"><button class="btn btn-primary btn-lg" data-action="next">Let’s go →</button></div>
  </div>`;
}
function Pivot(){
  return `<div class="card hero fade">
    <div class="kicker">Notice what just happened</div>
    <h1 style="font-size:clamp(2rem,6vw,3.6rem)">6 guesses.<br>6 birthdays.<br>0 that explained the person.</h1>
    <p class="tag">Every time, the confident answer was an <b>age</b>. Every time, the thing that actually explained them was a <b>value</b> — and values don’t carry a birth year.<br><br>So from here the game stops rewarding the age guess and starts rewarding the read. You’ve each got <b>three Bold reads</b> — press them when you can truly see the value.</p>
    <div class="row"><button class="btn btn-primary btn-lg" data-action="next">Start scoring →</button></div>
  </div>`;
}

/* ---------- R1 ---------- */
function genRef(active){
  return `<div class="chiprow">${GENS.map((g,i)=>{
    const on = active && active.includes(g.k);
    const dim = active && !on;
    return `<div class="rchip ${on?'on':''} ${dim?'dim':''}" style="--c:${g.c}">
      <span class="n">${i+1}</span>${g.name}<span class="sub">${g.range}</span></div>`;
  }).join('')}</div>`;
}
function R1Prompt(i){
  const it=R1[i];
  return `<div class="card prompt fade">
    <div class="kicker">Whose line is it? · ${i+1}/${R1.length}</div>
    <div class="voice"><span class="q">“</span>${esc(it.v)}<span class="q">”</span></div>
    <div class="instruction">As a team — which generation said it?</div>
    ${genRef(null)}
    <p class="fnote">Facilitator: let every team commit out loud, then hit Reveal.</p>
    ${revealRow()}
  </div>`;
}
function R1Reveal(i){
  const it=R1[i], val=VALUES[it.value];
  return `<div class="card reveal fade">
    <div class="kicker" style="text-align:center">Heard across… all of them</div>
    ${genRef(['boomer','x','mil','z'])}
    <div class="revhead" style="margin-top:26px">
      <div class="valbig pop" style="--c:${val.c}">
        <span class="lab">What they actually want</span>
        <span class="nm">${val.name}</span>
        <span class="tg">“${val.tag}”</span>
      </div>
    </div>
    <p class="tell">${esc(it.tell)}</p>
    ${navRow(i<R1.length-1?'Next voice →':'What this means →')}
  </div>`;
}

/* ---------- R2 ---------- */
function valueRef(correct){
  return `<div class="chiprow">${VORDER.map((k,idx)=>{
    const v=VALUES[k]; const on = correct===k; const dim = correct&&!on;
    return `<div class="rchip ${on?'on':''} ${dim?'dim':''}" style="--c:${v.c}">
      <span class="n">${idx+1}</span>${v.name}</div>`;
  }).join('')}</div>`;
}
function outcomeRow(label){
  return `<div class="awardwrap">
    <div class="awardttl">${label} &nbsp;<span class="sub">· tap what each team earned</span></div>
    <div class="awardgrid">${S.teams.map((t,i)=>{
      const o=S.results[S.step+':'+i]; const noBold = boldLeft(i)<=0 && o!=='boldWin' && o!=='boldMiss';
      return `<div class="ocard">
        <div class="oname"><span class="sw" style="background:${t.color}"></span>${esc(teamName(t,i))}</div>
        <div class="obtns">
          <button class="obtn ${o==='safe'?'on safe':''}" data-action="outcome" data-team="${i}" data-o="safe">✓ +${SAFE}</button>
          <button class="obtn ${o==='boldWin'?'on win':''}" data-action="outcome" data-team="${i}" data-o="boldWin" ${noBold?'disabled':''}>⚡ +${BOLDWIN}</button>
          <button class="obtn ${o==='boldMiss'?'on miss':''}" data-action="outcome" data-team="${i}" data-o="boldMiss" ${noBold?'disabled':''}>⚡ ${BOLDMISS}</button>
        </div>
      </div>`;
    }).join('')}</div>
  </div>`;
}
function bonusRow(type,label){
  return `<div class="awardwrap">
    <div class="awardttl">${label} &nbsp;<span class="sub">· +${BONUS}</span></div>
    <div class="awardgrid">${S.teams.map((t,i)=>{
      const on=!!S.bonus[S.step+':'+type+':'+i];
      return `<button class="abtn ${on?'on':''}" style="${on?`background:${t.color}`:''}" data-action="bonus" data-type="${type}" data-team="${i}">
        <span class="sw" style="background:${on?'#fff':t.color}"></span>${esc(teamName(t,i))}<span class="pl">+${BONUS}</span></button>`;
    }).join('')}</div>
  </div>`;
}
function R2Prompt(i){
  const it=R2[i];
  return `<div class="card prompt fade">
    <div class="kicker">Read the value · ${i+1}/${R2.length}</div>
    <div class="voice"><span class="q">“</span>${esc(it.v)}<span class="q">”</span></div>
    <div class="instruction">Which value is this person really protecting?</div>
    ${valueRef(null)}
    ${stakeTag()}
    <p class="fnote">Decide together: name the value — and whether to play it safe or spend a ⚡ Bold read. Then Reveal.</p>
    ${revealRow()}
  </div>`;
}
function R2Reveal(i){
  const it=R2[i], val=VALUES[it.value];
  return `<div class="card reveal fade">
    <div class="revhead">
      <div class="valbig pop" style="--c:${val.c}">
        <span class="lab">The value underneath</span>
        <span class="nm">${val.name}</span>
        <span class="tg">“${val.tag}”</span>
      </div>
    </div>
    ${valueRef(it.value)}
    <p class="tell">${esc(it.tell)}</p>
    ${outcomeRow('Score the read')}
    ${navRow(i<R2.length-1?'Next voice →':'Continue →')}
  </div>`;
}

/* ---------- Decode ---------- */
function DecodePrompt(i){
  const it=DECODE[i];
  return `<div class="card prompt fade">
    <div class="kicker">Decode together · ${i+1}/${DECODE.length}</div>
    <div class="voice">${esc(it.phrase)}</div>
    <div class="instruction">What might this person be protecting? Talk it through.</div>
    <p class="fnote">No single right answer. Reveal a few possibilities when the room’s had a go.</p>
    ${revealRow()}
  </div>`;
}
function DecodeReveal(i){
  const it=DECODE[i];
  return `<div class="card reveal fade">
    <div class="kicker" style="text-align:center">It could be any of these</div>
    <div class="optcol" style="max-width:720px">
      ${it.reads.map(r=>{ const v=VALUES[r.value]; return `<div class="opt" style="--c:${v.c};border-color:${v.c};background:color-mix(in srgb,${v.c} 8%,#fff)">
        <span class="n" style="background:${v.c};color:#fff">${v.name[0]}</span>
        <span><b style="color:${v.c}">${v.name}.</b> ${esc(r.text)}</span></div>`; }).join('')}
    </div>
    <p class="tell">${esc(it.note)}</p>
    ${bonusRow('insight','Bonus — teams that surfaced a sharp read')}
    ${navRow('Continue →')}
  </div>`;
}

/* ---------- R3 ---------- */
function R3Prompt(i){
  const it=R3[i];
  return `<div class="card prompt fade">
    <div class="kicker">Mind the gap · ${i+1}/${R3.length}</div>
    <div class="serif" style="font-size:clamp(1.3rem,3vw,2rem);margin-bottom:14px">${esc(it.title)}</div>
    <div class="setup-line">${esc(it.setup)}</div>
    <div class="filed">${esc(it.filed)}</div>
    <div class="optcol">
      ${it.options.map((o,idx)=>`<div class="opt"><span class="n">${idx+1}</span><span>${esc(o.t)}</span></div>`).join('')}
    </div>
    <div class="instruction">Which one is really going on? Pick as a team.</div>
    ${stakeTag()}
    <p class="fnote">Play it safe, or spend a ⚡ Bold read. Then Reveal.</p>
    ${revealRow()}
  </div>`;
}
function R3Reveal(i){
  const it=R3[i], a=VALUES[it.valA], b=VALUES[it.valB];
  return `<div class="card reveal fade">
    <div class="optcol" style="margin-top:4px">
      ${it.options.map((o,idx)=>`<div class="opt ${o.ok?'right':'wrong'}"><span class="n">${o.ok?'✓':idx+1}</span><span>${esc(o.t)}</span></div>`).join('')}
    </div>
    <div class="clash" style="margin-top:22px">The real collision:</div>
    <div class="twovals">
      <div class="vmini" style="--c:${a.c}"><span class="sw"></span>${a.name}</div>
      <span style="align-self:center;color:var(--ink3);font-weight:800">vs</span>
      <div class="vmini" style="--c:${b.c}"><span class="sw"></span>${b.name}</div>
    </div>
    <div class="bridge">
      <div class="h">🌉 Build the bridge</div>
      <div class="b">${esc(it.bridge)}</div>
    </div>
    ${outcomeRow('Score the diagnosis')}
    ${bonusRow('bridge','Bonus — best bridge from the room')}
    ${navRow(i<R3.length-1?'Next case →':'See the result →')}
  </div>`;
}

/* ---------- End ---------- */
function End(){
  const lead=leaders();
  const winners=S.teams.map((t,i)=>({t,i,sc:scoreOf(i)})).filter(x=>x.sc===lead&&lead>0);
  let winHtml;
  if(lead<=0){ winHtml=`<div class="winner"><div class="nm">A scoreless draw 🤝</div><p class="tag" style="margin-top:6px">Play a round for points next time!</p></div>`; }
  else if(winners.length===1){ const w=winners[0]; winHtml=`<div class="winner"><div class="crown">👑</div><div class="nm" style="color:${w.t.color}">${esc(teamName(w.t,w.i))}</div><p class="tag" style="margin-top:2px">${w.sc} points — best in the room at reading people, not birthdays.</p></div>`; }
  else{ winHtml=`<div class="winner"><div class="crown">👑</div><div class="nm">It’s a tie!</div><p class="tag" style="margin-top:2px">${winners.map(w=>esc(teamName(w.t,w.i))).join(' & ')} — ${lead} points each.</p></div>`; }

  return `<div class="card hero fade">
    <div class="kicker">And the point of the whole thing…</div>
    <h1 style="font-size:clamp(2.2rem,7vw,4.4rem)">It’s about values.</h1>
    <p class="tag">Every round, guessing the <b>generation</b> was a coin toss. Every round, reading the <b>value</b> won points. That wasn’t a trick of the questions — it’s the finding: at work, what people want is broadly shared. What differs is the <em>formative context</em> that shapes how a value shows up.</p>
    ${standings()}
    ${winHtml}
    <div class="valgrid">
      ${VORDER.map(k=>{const v=VALUES[k];return `<div class="vcard" style="--c:${v.c}"><div class="nm">${v.name}</div><div class="tg">${v.tag}</div></div>`;}).join('')}
    </div>
    <p class="tag" style="margin-top:18px">Not one of these six has a birth year.</p>
    <div class="debrief">
      <h3>🧭 The one habit to take back to the team</h3>
      <p style="color:var(--ink2);line-height:1.5">When something reads as an “age thing,” ask two questions before you judge:</p>
      <ul style="margin-top:8px">
        <li><b>What does this person value here?</b> (purpose, growth, security, autonomy, belonging, respect)</li>
        <li><b>What do I value here?</b> — then build the bridge between the two.</li>
      </ul>
      <p style="color:var(--ink2);line-height:1.5;margin-top:10px"><b>Talk it out:</b> Where on your team does an age label hide a values conversation? And whose “respect” means <em>experience</em> — while another’s means <em>voice</em>?</p>
    </div>
    <div class="row">
      <button class="btn" data-action="save">⬇ Save summary card</button>
      <button class="btn btn-primary btn-lg" data-action="replay">Play again</button>
    </div>
    <p class="fnote">Made to spark a conversation, not to settle it.</p>
  </div>`;
}

/* ---------- Share card ---------- */
function buildShareCard(){
  const lead=leaders();
  const arr=S.teams.map((t,i)=>({t,i,sc:scoreOf(i)})).sort((a,b)=>b.sc-a.sc);
  $('#sharecard').innerHTML=`
    <div style="font-family:'Outfit',sans-serif">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#e0563f,#d8902b);display:inline-block"></span>
        <span style="font-weight:800;letter-spacing:-.02em">Mind the Gap</span>
      </div>
      <div style="font-family:'DM Serif Display',serif;font-size:2.6rem;line-height:1;color:#211c15;margin:8px 0 4px">It’s about values.</div>
      <div style="color:#5f5647;font-weight:600;font-size:.98rem;line-height:1.4;margin-bottom:16px">The gap between us is about what we value — not when we were born.</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px">
        ${VORDER.map(k=>{const v=VALUES[k];return `<span style="border:1.5px solid ${v.c};color:${v.c};background:color-mix(in srgb,${v.c} 9%,#fff);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem">${v.name}</span>`;}).join('')}
      </div>
      <div style="border-top:1px solid #e7ddca;padding-top:14px">
        <div style="font-weight:700;color:#9b8f7c;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Final scores</div>
        ${arr.map(({t,i,sc})=>`<div style="display:flex;align-items:center;gap:9px;margin:6px 0;font-weight:700">
          <span style="width:12px;height:12px;border-radius:4px;background:${t.color};display:inline-block"></span>
          <span style="flex:1;color:#211c15">${esc(teamName(t,i))}</span>
          <span style="color:#5f5647;font-variant-numeric:tabular-nums">${sc}${sc===lead&&lead>0?' 👑':''}</span></div>`).join('')}
      </div>
    </div>`;
}
function saveCard(){
  if(typeof html2canvas==='undefined'){ alert('Save needs an internet connection for the image library. Try a screenshot instead!'); return; }
  buildShareCard();
  html2canvas($('#sharecard'),{scale:2,backgroundColor:null}).then(cv=>{
    const a=document.createElement('a'); a.download='mind-the-gap.png'; a.href=cv.toDataURL('image/png'); a.click();
  }).catch(()=>alert('Couldn’t generate the image — a screenshot works too.'));
}

/* ============================== EVENTS ============================== */
app.addEventListener('input',e=>{
  const inp=e.target.closest('input[data-team]'); if(!inp) return;
  S.teams[+inp.dataset.team].name=inp.value;
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  switch(a){
    case 'toTeams': go('teams'); break;
    case 'toIntro': go('intro'); break;
    case 'addTeam': if(S.teams.length<6){ S.teams.push({name:'',color:TEAM_COLORS[S.teams.length%TEAM_COLORS.length]}); render(); } break;
    case 'rmTeam': if(S.teams.length>2){ S.teams.splice(+el.dataset.team,1); S.teams.forEach((t,i)=>t.color=TEAM_COLORS[i%TEAM_COLORS.length]); render(); } break;
    case 'toggleDecode': S.includeDecode=!S.includeDecode; render(); break;
    case 'startGame': S.results={}; S.bonus={}; buildSequence(); go('play'); break;
    case 'next': next(); break;
    case 'back': back(); break;
    case 'outcome': setOutcome(+el.dataset.team, el.dataset.o); break;
    case 'bonus': toggleBonus(el.dataset.type,+el.dataset.team); break;
    case 'timer': S.timer.run?stopTimer():startTimer(); break;
    case 'save': saveCard(); break;
    case 'replay': stopTimer(); S.results={}; S.bonus={}; S.step=0; go('intro'); break;
  }
});
document.addEventListener('keydown',e=>{
  if(S.screen!=='play') return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); back(); }
});

render();
})();
</script>
</body>
</html>
